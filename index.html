<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Study Quiz">
    <title>Study Quiz</title>
    <style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #1d1d1f;
    background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 25%, #6C5B7B 50%, #355C7D 100%);
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 1px rgba(0,0,0,0.1);
}
.header {
    text-align: center;
    margin-bottom: 32px;
}
h1 {
    color: #1d1d1f;
    margin-bottom: 8px;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.5px;
}
.subtitle {
    font-size: 15px;
    font-style: italic;
    color: #86868b;
    font-weight: 400;
}
.form-group {
    margin-bottom: 24px;
}
.form-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #1d1d1f;
}
.form-control {
    width: 100%;
    padding: 14px;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    background: #f5f5f7;
    transition: all 0.25s ease;
}
.form-control:focus {
    outline: none;
    border-color: #FF6B9D;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
}
.checkbox-list {
    max-height: 300px;
    overflow-y: auto;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    padding: 12px;
    background: #f5f5f7;
}
.checkbox-list label {
    display: block;
    padding: 10px;
    cursor: pointer;
    font-weight: normal;
    border-radius: 8px;
    transition: all 0.2s ease;
}
.checkbox-list label:hover {
    background: rgba(255, 107, 157, 0.1);
}
.checkbox-list input {
    margin-right: 10px;
    accent-color: #FF6B9D;
}
.btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
}
.btn-primary:active {
    transform: translateY(0);
}
.btn-back {
    padding: 10px 18px;
    background: #86868b;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}
.btn-back:hover {
    background: #6e6e73;
    transform: translateY(-1px);
}
.hidden { display: none !important; }
.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}
.quiz-progress {
    color: #86868b;
    font-size: 14px;
    font-weight: 500;
}
#question-container {
    margin: 30px 0;
    padding: 24px;
    background: #f5f5f7;
    border-radius: 12px;
}
.question-text {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.3px;
}
.options-list {
    list-style: none;
}
.options-list li {
    margin-bottom: 12px;
}
.options-list label {
    display: flex;
    align-items: center;
    padding: 16px;
    background: white;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
}
.options-list label:hover {
    border-color: #FF6B9D;
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.15);
}
.options-list input {
    margin-right: 12px;
    accent-color: #FF6B9D;
}
.answer-input {
    width: 100%;
    padding: 16px;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    background: #f5f5f7;
    transition: all 0.25s ease;
}
.answer-input:focus {
    outline: none;
    border-color: #FF6B9D;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
}
.feedback {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    border-left: 4px solid #FFC107;
    background: rgba(255, 193, 7, 0.15);
}
.feedback.correct {
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    border-left-color: #34C759;
}
.feedback.incorrect {
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
    border-left-color: #FF3B30;
}
.nav-buttons {
    margin-top: 24px;
}
#results {
    margin-top: 32px;
}
.score-summary {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.5px;
}
.result-item {
    margin-bottom: 16px;
    padding: 20px;
    background: #f5f5f7;
    border-radius: 12px;
    border-left: 4px solid #d2d2d7;
    transition: all 0.25s ease;
}
.result-item:hover {
    transform: translateX(4px);
}
.result-item.correct {
    border-left-color: #34C759;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
}
.result-item.incorrect {
    border-left-color: #FF3B30;
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
}

    </style>
</head>
<body>
    <div class="container">
        <!-- Setup Screen -->
        <div id="setup-screen">
            <div class="header">
                <h1>QuickQuiz</h1>
            </div>

            <div class="form-group">
                <label>Subject:</label>
                <select id="subject-select" class="form-control">
                    <option value="">-- Select Subject --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sections (pick one or more):</label>
                <div id="sections-list" class="checkbox-list"></div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="show-feedback" checked>
                    Show feedback after each question
                </label>
            </div>

            <button id="start-quiz-btn" class="btn-primary">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <button id="back-btn" class="btn-back">← Back to Setup</button>
                <div class="quiz-progress">
                    Question <span id="current">1</span> / <span id="total">0</span>
                </div>
            </div>

            <div id="question-container"></div>

            <div class="nav-buttons">
                <button id="next-btn" class="btn-primary">Next →</button>
            </div>

            <div id="results" class="hidden"></div>
        </div>
    </div>

    <script>
// All questions organized by subject/section
const ALL_QUESTIONS = {"Science": {"Topic 6 - Populations, Communities, and Ecosystems": [{"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What term describes the role of an organism in its habitat?", "type": "Single Choice", "options": ["Population", "Niche", "Predation", "Succession"], "correct_answer": "Niche", "feedback": "A niche is an organism's role in its habitat, including how it gets food and survives."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "A niche includes how an organism gets food, when and how it reproduces, and the physical conditions it needs to survive.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The lesson defines a niche as much more than just where an organism lives."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What is competition in an ecosystem?", "type": "Single Choice", "options": ["The struggle between organisms to survive using the same limited resources", "A relationship in which both species benefit", "A series of predictable changes in a community over time", "The disappearance of a species from Earth"], "correct_answer": "The struggle between organisms to survive using the same limited resources", "feedback": "Competition happens when organisms use the same limited resources."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Species that share a habitat often have adaptations that help reduce competition.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The slides explain that shared habitats often lead to adaptations that reduce competition."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "In a predator-prey relationship, the organism that is hunted is called the ____.", "type": "Short Answer", "options": [], "correct_answer": "prey", "feedback": "The predator does the hunting; the prey is hunted."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What is predation?", "type": "Single Choice", "options": ["A relationship in which one organism kills another for food or nutrients", "A relationship in which one organism benefits and the other is unaffected", "A form of succession that happens after a fire", "The movement of organisms to a new habitat"], "correct_answer": "A relationship in which one organism kills another for food or nutrients", "feedback": "Predation is an interaction in which a predator kills prey for food or nutrients."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Camouflage, warning coloration, and protective coverings can help prey avoid being killed.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "These are examples of prey adaptations that improve survival."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Symbiosis is:", "type": "Single Choice", "options": ["Any relationship in which two species live closely together", "A type of competition for food", "A rapid change in climate", "The first stage of succession"], "correct_answer": "Any relationship in which two species live closely together", "feedback": "The lesson defines symbiosis as any close relationship between two species."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which symbiotic relationship benefits one species while the other species is neither helped nor harmed?", "type": "Single Choice", "options": ["Commensalism", "Mutualism", "Parasitism", "Predation"], "correct_answer": "Commensalism", "feedback": "In commensalism, one species benefits and the other is unaffected."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which symbiotic relationship benefits both species?", "type": "Single Choice", "options": ["Commensalism", "Mutualism", "Parasitism", "Competition"], "correct_answer": "Mutualism", "feedback": "Mutualism means both species benefit from the relationship."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which relationship involves one organism living on, in, or inside another organism and harming it?", "type": "Single Choice", "options": ["Commensalism", "Mutualism", "Parasitism", "Predation"], "correct_answer": "Parasitism", "feedback": "Parasitism benefits one organism while harming the host."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Primary succession occurs in an area where:", "type": "Single Choice", "options": ["No soil or organisms exist", "A fire has left the soil in place", "A predator has removed prey", "Two species share a niche"], "correct_answer": "No soil or organisms exist", "feedback": "Primary succession starts where there is no soil and no existing community."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which organisms are commonly pioneer species during primary succession?", "type": "Multiple Choice", "options": ["Lichens", "Mosses", "Oak trees", "Wolves"], "correct_answer": ["Lichens", "Mosses"], "feedback": "Pioneer species are usually lichens and mosses, which help begin soil formation."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Secondary succession happens more quickly than primary succession because soil is already present.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Secondary succession begins after a disturbance in an area where soil already exists."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Longleaf pine trees are adapted to survive regular:", "type": "Single Choice", "options": ["Forest fires", "Avalanches", "Tsunamis", "Blizzards"], "correct_answer": "Forest fires", "feedback": "Longleaf pines depend on regular forest fires and have traits that help them survive them."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Biodiversity is the:", "type": "Single Choice", "options": ["Number and variety of different species in an area", "Amount of rainfall in a region", "Population size of one species", "Rate of succession in a habitat"], "correct_answer": "Number and variety of different species in an area", "feedback": "Healthy ecosystems have biodiversity, meaning many kinds of species."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "A keystone species is a species that:", "type": "Single Choice", "options": ["Influences the survival of many other species in an ecosystem", "Always lives at the top of a food chain", "Can survive without any competition", "Only lives in forests"], "correct_answer": "Influences the survival of many other species in an ecosystem", "feedback": "Keystone species help maintain ecosystem balance because many species depend on them."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Greater genetic diversity makes a species more likely to adapt and survive environmental change.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "More genetic variation improves a species' chances of adapting to new conditions."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What is extinction?", "type": "Single Choice", "options": ["The disappearance of all members of a species from Earth", "A stable ecosystem with many species", "A temporary drop in population size", "A relationship between predator and prey"], "correct_answer": "The disappearance of all members of a species from Earth", "feedback": "Extinction means an entire species is gone from Earth."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Resources that are used but not consumed, such as shade from trees or recreation in habitats, have:", "type": "Single Choice", "options": ["Indirect value", "Direct value", "Genetic value", "Competitive value"], "correct_answer": "Indirect value", "feedback": "Indirect value comes from benefits we use without consuming the resource itself."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Mass extinction differs from background extinction because mass extinction:", "type": "Single Choice", "options": ["Kills many different species in a short time", "Usually affects only one species over a long period", "Always happens because of one predator", "Only happens in the ocean"], "correct_answer": "Kills many different species in a short time", "feedback": "Mass extinctions affect many species quickly, unlike background extinction."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which human activity can reduce biodiversity?", "type": "Single Choice", "options": ["Deforestation", "Pollination", "Nutrient cycling", "Seed dispersal"], "correct_answer": "Deforestation", "feedback": "Removing habitats and natural resources can reduce biodiversity."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Match each ecosystem interaction term to its correct description:", "type": "Matching", "pairs": [{"term": "Competition", "match": "The struggle between organisms to survive using the same limited resources"}, {"term": "Predation", "match": "One organism kills another for food or nutrients"}, {"term": "Mutualism", "match": "A symbiotic relationship in which both species benefit"}, {"term": "Commensalism", "match": "A symbiotic relationship in which one species benefits and the other is neither helped nor harmed"}, {"term": "Parasitism", "match": "A relationship in which one organism benefits while harming the host"}], "feedback": "These terms describe major interactions and processes in Topic 6.", "options": []}], "Chapter 7 Topic 1 - Patterns of Inheritance": [{"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Who is often called the father of modern genetics?", "type": "Single Choice", "options": ["Gregor Mendel", "Charles Darwin", "Isaac Newton", "Ptolemy"], "correct_answer": "Gregor Mendel", "feedback": "Mendel carefully studied inheritance in pea plants and quantified his results."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Heredity is the passing of traits from parents to offspring.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Heredity describes how traits are passed from one generation to the next."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Mendel studied pea plants because they had several clear traits that could be crossed and counted.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Mendel compared traits such as plant height, seed color, seed shape, flower color, and pod shape."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "In Mendel's experiments, the original parent plants are called the:", "type": "Single Choice", "options": ["P generation", "F1 generation", "F2 generation", "Phenotype"], "correct_answer": "P generation", "feedback": "The P generation is the parent generation used in the first cross."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "What does the F1 generation mean?", "type": "Single Choice", "options": ["The first generation of offspring", "The original parent plants", "The second generation of offspring", "A plant with two recessive alleles"], "correct_answer": "The first generation of offspring", "feedback": "F1 means first filial generation, or the first offspring generation."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "When Mendel crossed tall and short pea plants, all of the F1 offspring were tall.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The dominant tall trait appeared in the F1 generation."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "In Mendel's seed-color crosses, the recessive green trait could reappear in the F2 generation.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "A recessive trait can be hidden in F1 and show again in F2 when two recessive alleles are inherited."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Alleles are:", "type": "Single Choice", "options": ["Different forms of a gene", "The physical appearance of an organism", "Tools for measuring probability", "Only traits learned during life"], "correct_answer": "Different forms of a gene", "feedback": "Alleles are different versions of a gene, such as yellow or green seed-color alleles."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "A dominant allele is represented by a capital letter.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Geneticists usually write dominant alleles with capital letters, such as G."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "A recessive allele is hidden whenever a dominant allele is present.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "A recessive trait appears only when the organism inherits two recessive alleles."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Which genotype is hybrid for pea seed color?", "type": "Single Choice", "options": ["Gg", "GG", "gg", "G"], "correct_answer": "Gg", "feedback": "A hybrid has one dominant allele and one recessive allele."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "An organism with two identical alleles for a trait is called:", "type": "Single Choice", "options": ["Homozygous", "Heterozygous", "Hybrid", "Phenotype"], "correct_answer": "Homozygous", "feedback": "Homozygous means the alleles are the same."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "An organism with one dominant allele and one recessive allele is called:", "type": "Single Choice", "options": ["Heterozygous", "Homozygous dominant", "Homozygous recessive", "Purebred"], "correct_answer": "Heterozygous", "feedback": "Heterozygous means the two alleles are different."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "The genotype is an organism's physical appearance.", "type": "True/False", "options": ["True", "False"], "correct_answer": "False", "feedback": "Genotype is the allele combination; phenotype is the visible trait."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "The phenotype is the visible expression of an organism's genes.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Height, color, shape, size, and texture are examples of phenotypes."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "For yellow pea seed color, a plant with genotype GG or Gg would show which phenotype?", "type": "Single Choice", "options": ["Yellow seeds", "Green seeds", "Wrinkled seeds", "White flowers"], "correct_answer": "Yellow seeds", "feedback": "Yellow is dominant, so both GG and Gg produce yellow seeds."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "For a recessive trait to appear, the offspring must inherit:", "type": "Single Choice", "options": ["Two recessive alleles", "One dominant allele", "One dominant and one recessive allele", "No alleles"], "correct_answer": "Two recessive alleles", "feedback": "A recessive phenotype appears when no dominant allele is present."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Probability describes how likely it is that an event will occur.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Probability is used to predict possible inheritance outcomes."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Each coin toss or allele donation is independent of the previous one.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Previous outcomes do not change the probability of the next outcome."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "What tool do geneticists use to predict possible allele combinations in offspring?", "type": "Single Choice", "options": ["Punnett square", "Microscope", "Food web", "Bar graph"], "correct_answer": "Punnett square", "feedback": "Punnett squares model the probability of allele combinations."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "In a cross between two hybrid yellow pea plants (Gg x Gg), which genotype appears in 2 out of 4 boxes?", "type": "Single Choice", "options": ["Gg", "GG", "gg", "YY"], "correct_answer": "Gg", "feedback": "A Gg x Gg Punnett square gives GG, Gg, Gg, and gg."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "In a Gg x Gg cross, what fraction of offspring are expected to show the dominant yellow seed phenotype?", "type": "Single Choice", "options": ["3/4", "1/4", "1/2", "4/4"], "correct_answer": "3/4", "feedback": "GG and Gg offspring show the dominant phenotype, making 3 out of 4 boxes."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "The allele that each parent donates to offspring is random.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Each parent randomly passes one allele for a trait to the offspring."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "A plant with genotype gg is homozygous ____.", "type": "Short Answer", "options": [], "correct_answer": "recessive", "feedback": "Two lowercase alleles represent a homozygous recessive genotype."}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Match each inheritance term to its correct meaning:", "type": "Matching", "pairs": [{"term": "Heredity", "match": "Passing traits from parents to offspring"}, {"term": "Allele", "match": "A different form of a gene"}, {"term": "Genotype", "match": "An organism's allele combination"}, {"term": "Phenotype", "match": "An organism's visible trait"}, {"term": "Probability", "match": "A number describing how likely an event is"}], "feedback": "These terms are central to Chapter 7 Topic 1.", "options": []}, {"subject": "Science", "section": "Chapter 7 Topic 1 - Patterns of Inheritance", "question": "Sort each example as genotype or phenotype:", "type": "Categorization", "categories": ["Genotype", "Phenotype"], "items": [{"text": "GG", "category": "Genotype"}, {"text": "Gg", "category": "Genotype"}, {"text": "gg", "category": "Genotype"}, {"text": "Yellow seed color", "category": "Phenotype"}, {"text": "Green seed color", "category": "Phenotype"}], "feedback": "Genotype is the allele combination; phenotype is the visible trait.", "options": []}]}, "History": {"Chapter 8 - The Rise of Rome": [{"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome was built near which river?", "type": "Single Choice", "options": ["Nile River", "Tiber River", "Danube River", "Euphrates River"], "correct_answer": "Tiber River", "feedback": "Rome grew beside the Tiber River at an easy crossing point."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome's seven hills made the city easier to defend from attack.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The steep hills helped protect the city."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Compared with Greece, Italy helped Rome grow because Italy had:", "type": "Single Choice", "options": ["Better farmland and mountains that were easier to cross", "More deserts and fewer rivers", "No nearby seas for trade", "Only small isolated valleys"], "correct_answer": "Better farmland and mountains that were easier to cross", "feedback": "Italy could support more people, and its geography did not isolate communities as much as Greece did."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Which people changed Rome from a village of huts into a city with streets, temples, and public buildings?", "type": "Single Choice", "options": ["Persians", "Etruscans", "Carthaginians", "Hebrews"], "correct_answer": "Etruscans", "feedback": "The Etruscans strongly influenced early Roman development."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "According to Roman legend, who founded Rome in 753 B.C.?", "type": "Single Choice", "options": ["Aeneas", "Hannibal", "Romulus", "Cincinnatus"], "correct_answer": "Romulus", "feedback": "Roman tradition says Romulus founded the city after quarreling with Remus."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome became a republic in 509 B.C. after the Romans overthrew Etruscan rule.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The republic replaced the Etruscan kings."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The smaller Roman army groups that could move quickly through enemy lines were called ____.", "type": "Short Answer", "options": [], "correct_answer": "legions", "feedback": "Roman armies were reorganized into legions for flexibility and control."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "What were Rome's wealthy landowners and nobles called?", "type": "Single Choice", "options": ["Plebeians", "Patricians", "Praetors", "Allies"], "correct_answer": "Patricians", "feedback": "Patricians made up Rome's ruling class."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "In the Roman Republic, the top government officials were the:", "type": "Single Choice", "options": ["Consuls", "Praetors", "Tribunes", "Senators"], "correct_answer": "Consuls", "feedback": "Two consuls headed the army and ran the government."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Each Roman consul could veto the other consul's decisions.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The veto helped keep either consul from becoming too powerful."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome's first written code of laws was called the:", "type": "Single Choice", "options": ["Law of Nations", "Julian Code", "Twelve Tables", "Code of Hammurabi"], "correct_answer": "Twelve Tables", "feedback": "The Twelve Tables were Rome's first written laws and became the basis of later Roman law."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The Law of Nations helped spread the idea that accused people could defend themselves and were innocent until proven guilty.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Roman law promoted principles of justice that influenced later legal systems."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The First Punic War began because Rome and Carthage both wanted control of:", "type": "Single Choice", "options": ["Sicily", "Egypt", "Gaul", "Greece"], "correct_answer": "Sicily", "feedback": "Control of Sicily led Rome and Carthage into war in 264 B.C."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Hannibal attacked Italy by crossing the Alps during the Second Punic War.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Hannibal marched from Spain over the Alps into Italy."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "At which battle did Hannibal hand Rome one of its worst defeats in 216 B.C.?", "type": "Single Choice", "options": ["Zama", "Actium", "Cannae", "Adrianople"], "correct_answer": "Cannae", "feedback": "The Roman army suffered a devastating loss at Cannae."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "A political alliance of three people is called a:", "type": "Single Choice", "options": ["Republic", "Triumvirate", "Legion", "Province"], "correct_answer": "Triumvirate", "feedback": "Crassus, Pompey, and Caesar formed the First Triumvirate."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The phrase \"crossing the Rubicon\" means making a decision that cannot be taken back.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Caesar crossed the Rubicon knowing it would trigger civil war."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Who defeated Antony and Cleopatra at the Battle of Actium?", "type": "Single Choice", "options": ["Hannibal", "Octavian", "Cicero", "Scipio"], "correct_answer": "Octavian", "feedback": "Octavian won at Actium and became the strongest leader in Rome."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Who became Rome's first emperor?", "type": "Single Choice", "options": ["Julius Caesar", "Augustus", "Nero", "Tiberius"], "correct_answer": "Augustus", "feedback": "Octavian took the title Augustus and became Rome's first emperor."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "What does Pax Romana mean?", "type": "Single Choice", "options": ["Roman Law", "Roman Peace", "Roman Senate", "Roman Army"], "correct_answer": "Roman Peace", "feedback": "Pax Romana was the long era of peace and prosperity that began under Augustus."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Augustus made the tax system fairer by turning tax collectors into permanent government workers.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "This reform reduced corruption in tax collecting."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Plebeians included artisans, shopkeepers, and owners of small farms.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Plebeians were most of Rome's people, though they had less social status than patricians."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Place these major Roman events in chronological order:", "type": "Ordering", "items": ["Rome becomes a republic", "Romans adopt the Twelve Tables", "Rome destroys Carthage", "Julius Caesar is assassinated", "Octavian becomes Rome's first emperor"], "correct_order": [0, 1, 2, 3, 4], "feedback": "These events trace Rome's rise from republic to empire.", "options": []}], "Chapter 9 - Roman Civilization": [{"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "The Romans borrowed many ideas from the Greeks but changed them to fit Roman needs.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Romans admired Greek culture, but they adapted it for practical Roman use."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Roman statues often looked different from Greek statues because Roman statues were more:", "type": "Single Choice", "options": ["Realistic", "Mythical", "Colorful", "Gigantic"], "correct_answer": "Realistic", "feedback": "Roman artists showed wrinkles and other real features rather than ideal perfection."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Which Roman building feature helped support bridges, aqueducts, and buildings?", "type": "Single Choice", "options": ["Arch", "Pyramid", "Moat", "Terrace"], "correct_answer": "Arch", "feedback": "Romans were the first to make full use of the arch."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Who wrote the Aeneid?", "type": "Single Choice", "options": ["Livy", "Virgil", "Horace", "Tacitus"], "correct_answer": "Virgil", "feedback": "Virgil's Aeneid told the story of Aeneas and Rome's legendary beginnings."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Horace was known for writing:", "type": "Single Choice", "options": ["Satires and odes", "Law codes and speeches", "Maps of the stars", "Medical textbooks"], "correct_answer": "Satires and odes", "feedback": "Horace wrote works that mocked human weakness and poems expressing strong feelings."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Galen emphasized anatomy and learned about inner organs by cutting open dead animals.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Galen's medical ideas influenced doctors for more than 1,500 years."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Ptolemy is remembered for:", "type": "Single Choice", "options": ["Mapping over 1,000 stars and studying the movements of planets and stars", "Leading a slave revolt", "Writing the Aeneid", "Designing the Colosseum"], "correct_answer": "Mapping over 1,000 stars and studying the movements of planets and stars", "feedback": "Ptolemy carefully mapped stars and created rules to explain heavenly motion."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "The open area at the center of a Roman city used as a marketplace and public square was the:", "type": "Single Choice", "options": ["Forum", "Pantheon", "Circus", "Villa"], "correct_answer": "Forum", "feedback": "The Forum was the center of public life in many Roman cities."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Most poor Romans in the city lived in crowded apartment buildings, often in only one room.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "High rent forced many poor families into cramped apartments."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "The head of a Roman household was called the:", "type": "Single Choice", "options": ["Consul", "Paterfamilias", "Praetor", "Gladiator"], "correct_answer": "Paterfamilias", "feedback": "The paterfamilias had authority over the family."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Spartacus led a revolt of enslaved people in Italy.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Spartacus led a major slave revolt beginning in 73 B.C."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Inflation is:", "type": "Single Choice", "options": ["Rapidly increasing prices", "A decrease in trade", "A type of Roman road", "A system of writing laws"], "correct_answer": "Rapidly increasing prices", "feedback": "Rome suffered inflation when its coins lost value and prices rose."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Barter means to:", "type": "Single Choice", "options": ["Exchange goods without using money", "Pay taxes with gold coins", "Trade only with foreign merchants", "Use roads to move goods quickly"], "correct_answer": "Exchange goods without using money", "feedback": "As Roman money lost value, many people returned to barter."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Which emperor divided the empire into four parts because it was too large for one ruler?", "type": "Single Choice", "options": ["Augustus", "Diocletian", "Constantine", "Justinian"], "correct_answer": "Diocletian", "feedback": "Diocletian tried to reform the empire by dividing its administration."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Constantine made sure Christians could no longer be persecuted.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Constantine supported freedom of religion and expanded opportunities for Christians."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Which emperor split the Roman Empire into eastern and western parts after his death in A.D. 395?", "type": "Single Choice", "options": ["Marcus Aurelius", "Theodosius", "Alaric", "Odoacer"], "correct_answer": "Theodosius", "feedback": "Theodosius divided the empire into two separate parts."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Which Visigoth leader captured Rome in A.D. 410?", "type": "Single Choice", "options": ["Belisarius", "Alaric", "Theodoric", "Commodus"], "correct_answer": "Alaric", "feedback": "Alaric led the Visigoths in the sack of Rome in 410."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Historians often mark the fall of the Western Roman Empire in A.D. 476 when Odoacer overthrew Romulus Augustulus.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Odoacer's overthrow of the last western emperor is the usual marker for Rome's fall in the West."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Why was the Justinian Code important?", "type": "Single Choice", "options": ["It simplified and reorganized Byzantine laws so people could understand them more easily", "It created the first Roman army", "It ended trade with Asia", "It replaced Christianity with Roman gods"], "correct_answer": "It simplified and reorganized Byzantine laws so people could understand them more easily", "feedback": "The Justinian Code had a lasting influence on laws across Europe."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Theodora persuaded Justinian to stay in Constantinople and crush an uprising instead of fleeing.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Theodora's advice helped Justinian keep his throne and strengthen his rule."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Hagia Sophia means Holy ____.", "type": "Short Answer", "options": [], "correct_answer": "Wisdom", "feedback": "Hagia Sophia means ?Holy Wisdom.?"}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Why was Constantinople especially wealthy?", "type": "Single Choice", "options": ["It sat at major trade crossroads between Europe and Asia", "It controlled all of Rome's gold mines", "It had no taxes", "It was hidden from invaders in the desert"], "correct_answer": "It sat at major trade crossroads between Europe and Asia", "feedback": "Its location on important waterways and trade routes made Constantinople rich."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Byzantine mosaics were pictures made from many bits of colored glass or stone.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Mosaics were a major Byzantine art form, especially in churches."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "The Byzantine Empire preserved Greek culture and Roman law and lasted for about 1,000 years.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Byzantium carried Roman and Greek traditions forward for centuries."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Match each Roman or Byzantine figure to the achievement most closely connected to that person:", "type": "Matching", "pairs": [{"term": "Diocletian", "match": "Divided the empire into four parts in an effort to reform it"}, {"term": "Constantine", "match": "Moved the capital to Constantinople and supported Christianity"}, {"term": "Justinian", "match": "Reorganized Byzantine law into the Justinian Code"}, {"term": "Theodora", "match": "Helped expand women's rights and urged Justinian to stay and fight an uprising"}], "feedback": "These leaders shaped Roman decline and Byzantine strength.", "options": []}], "Chapter 10 - Christianity": [{"subject": "History", "section": "Chapter 10 - Christianity", "question": "Christianity began in which Roman province?", "type": "Single Choice", "options": ["Judaea", "Gaul", "Britain", "Egypt"], "correct_answer": "Judaea", "feedback": "Jesus began preaching in Judaea and Galilee under Roman rule."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "In A.D. 6, Augustus turned Judah into the Roman province of Judaea.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "A Roman governor called a procurator ruled Judaea for the emperor."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "The Jews who wanted to fight Roman rule and take back control were called:", "type": "Single Choice", "options": ["Zealots", "Apostles", "Patriarchs", "Iconoclasts"], "correct_answer": "Zealots", "feedback": "The Zealots helped start the revolt against Rome in A.D. 66."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "After revolts in Judaea, the Romans destroyed the temple and later forced Jews out of Jerusalem.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Roman responses to Jewish revolts included destruction of the temple and banishment from Jerusalem."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "What did many Jews expect the messiah to do?", "type": "Single Choice", "options": ["Restore Israel's freedom and glory", "Build Roman roads", "Create the Byzantine Empire", "End all trade"], "correct_answer": "Restore Israel's freedom and glory", "feedback": "Many expected a deliverer like King David who would restore the kingdom."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Jesus' closest 12 followers were called:", "type": "Single Choice", "options": ["Disciples", "Martyrs", "Bishops", "Monks"], "correct_answer": "Disciples", "feedback": "The 12 disciples followed Jesus during his ministry."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Which message was central to Jesus' teaching?", "type": "Single Choice", "options": ["Love God and love your neighbor", "Honor the emperor as a god", "Conquer Rome by force", "Avoid helping outsiders"], "correct_answer": "Love God and love your neighbor", "feedback": "The chapter emphasizes Jesus' message of love, forgiveness, and turning from sin."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Parables are stories from everyday life used to express spiritual ideas.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Jesus used parables such as the Prodigal Son and the Good Samaritan."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Jesus was crucified because Roman leaders feared his message could threaten law and order.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Roman rulers charged Jesus with treason and used crucifixion for political rebels and lower-class criminals."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "The resurrection is the belief that Jesus:", "type": "Single Choice", "options": ["Rose from the dead", "Wrote the gospels", "Became emperor", "Led the Zealots"], "correct_answer": "Rose from the dead", "feedback": "Reports of Jesus' resurrection helped lead to the rise of Christianity."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Christ comes from a Greek word meaning:", "type": "Single Choice", "options": ["Messiah", "Teacher", "Emperor", "Disciple"], "correct_answer": "Messiah", "feedback": "Christos is Greek for messiah."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "What did early Christian churches do?", "type": "Multiple Choice", "options": ["Provided communities for worship and teaching", "Prayed and studied the Hebrew Bible", "Shared a ritual meal remembering Jesus", "Built Roman warships"], "correct_answer": ["Provided communities for worship and teaching", "Prayed and studied the Hebrew Bible", "Shared a ritual meal remembering Jesus"], "feedback": "Early churches worshiped, taught, prayed, studied scripture, and remembered Jesus' death and resurrection."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Which apostle helped spread Christianity to Gentiles and wrote letters to churches?", "type": "Single Choice", "options": ["Paul", "Cincinnatus", "Hannibal", "Leo III"], "correct_answer": "Paul", "feedback": "Paul traveled widely and wrote epistles to Christian communities."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Salvation means being saved from sin and allowed to enter heaven.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Christians taught that accepting Jesus and his teachings brought salvation."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Which Roman infrastructure helped Christians travel and spread their message?", "type": "Single Choice", "options": ["Roads", "Aqueducts", "Colosseums", "Villas"], "correct_answer": "Roads", "feedback": "Roman peace, roads, and common languages helped Christianity spread."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Why did Roman officials often see Christians as a threat?", "type": "Single Choice", "options": ["Christians refused to honor the emperor as a god", "Christians controlled the army", "Christians refused to help the poor", "Christians were Carthaginian allies"], "correct_answer": "Christians refused to honor the emperor as a god", "feedback": "Christians believed in one God and would not worship the emperor."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Martyrs are people who die for their faith.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Many Christians killed for their beliefs were remembered as martyrs."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "What did Constantine's Edict of Milan do in A.D. 313?", "type": "Single Choice", "options": ["Made Christianity legal and gave religious freedom", "Divided the Roman Empire", "Created the first monastery", "Banned all icons"], "correct_answer": "Made Christianity legal and gave religious freedom", "feedback": "The Edict of Milan legalized Christianity and allowed religious freedom."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "Which emperor made Christianity the official religion of the Roman Empire in A.D. 392?", "type": "Single Choice", "options": ["Theodosius", "Diocletian", "Augustus", "Nero"], "correct_answer": "Theodosius", "feedback": "Theodosius made Christianity Rome's official religion and outlawed other religions."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "The clergy were regular church members, while the laity were church leaders.", "type": "True/False", "options": ["True", "False"], "correct_answer": "False", "feedback": "Clergy were church leaders; laity were regular members."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "By around A.D. 300, local churches were led by clergy called:", "type": "Single Choice", "options": ["Priests", "Consuls", "Zealots", "Iconoclasts"], "correct_answer": "Priests", "feedback": "Priests led local churches, bishops led dioceses, and patriarchs led major regions."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "The bishop of Rome became known by what special title?", "type": "Single Choice", "options": ["Pope", "Procurator", "Patriarch of Constantinople", "Missionary"], "correct_answer": "Pope", "feedback": "By A.D. 600, the bishop of Rome had gained the title pope."}, {"subject": "History", "section": "Chapter 10 - Christianity", "question": "The New Testament includes the gospels, apostles' writings, and letters such as Paul's epistles.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Early Christian writings were gathered into the New Testament."}, {"subject": "History", k": "The prologue connects Mae, Winnie, and the stranger before their stories meet."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 1: What is unusual about the road near Treegap?", "type": "Single Choice", "options": ["It goes around the wood instead of through it", "It leads straight to the ocean", "It is guarded by soldiers", "It disappears at night"], "correct_answer": "It goes around the wood instead of through it", "feedback": "The road curves around the wood, helping keep the spring hidden."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 2: Why is Mae Tuck excited when she wakes up?", "type": "Single Choice", "options": ["Her sons are coming home", "She has found a new house", "She is leaving Treegap forever", "She is going to sell the spring"], "correct_answer": "Her sons are coming home", "feedback": "Mae expects Miles and Jesse to return for their ten-year visit."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 3: Winnie feels trapped by her family's rules and thinks about running away.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Winnie talks to the toad and imagines proving she can make her own choices."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 4: What is the man in the yellow suit trying to learn from Winnie and her grandmother?", "type": "Single Choice", "options": ["The source of the music he hears", "Where the constable lives", "How to buy a horse", "Where Mae's house is"], "correct_answer": "The source of the music he hears", "feedback": "He connects the music-box melody to the family he has been searching for."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 5: Why does Winnie enter the wood?", "type": "Single Choice", "options": ["She decides to explore instead of fully running away", "She is chasing the constable", "Her family sends her there", "She wants to sell the wood"], "correct_answer": "She decides to explore instead of fully running away", "feedback": "Winnie is afraid to run far away, so she goes into her family's wood."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 6: Why do the Tucks take Winnie with them after she sees the spring?", "type": "Single Choice", "options": ["They need to explain why she must not drink from it", "They plan to keep her forever", "They want her to sell the wood", "They think she is a ghost"], "correct_answer": "They need to explain why she must not drink from it", "feedback": "The Tucks fear the secret of the spring will spread before Winnie understands it."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 7: What happened to the Tucks after they drank from the spring?", "type": "Single Choice", "options": ["They stopped aging and could not die", "They became rich", "They forgot Treegap", "They turned invisible"], "correct_answer": "They stopped aging and could not die", "feedback": "The Tucks discover that the spring water has made them immortal."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 8: Jesse sees immortality as exciting, while Miles warns Winnie that it has serious consequences.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The brothers show different attitudes toward living forever."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole Book Quiz", "question": "Chapter 9: Who secretly follows the Tucks and Winnie?", "type": "Single Choice", "options": ["The man in the yellow suit", "The constable", "Winnie's father", "The toad"], "correct_answer": "The man in the yellow suit", "feedback": "He follows them and later uses what he learns for his own plan."}, {"subject": "ALA", "section": "Tuck Everlasting - Whole B
