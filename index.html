let currentQuiz = [];
let currentIndex = 0;
let userAnswers = [];
let showFeedback = true;

// Wait for DOM to be ready
document.addEventListener('DOMContentLoaded', function() {
    // Debug: Check if data loaded
    console.log('ALL_QUESTIONS:', ALL_QUESTIONS);
    console.log('Subjects found:', Object.keys(ALL_QUESTIONS));

    // Initialize - populate subjects
    const subjects = Object.keys(ALL_QUESTIONS).sort();
    const subjectSelect = document.getElementById('subject-select');

    if (!subjectSelect) {
        console.error('subject-select element not found!');
        return;
    }

    if (subjects.length === 0) {
        console.error('No subjects found in data!');
        subjectSelect.innerHTML = '<option value="">No subjects found - check data</option>';
    } else {
        console.log('Populating', subjects.length, 'subjects');
        subjects.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            subjectSelect.appendChild(opt);
        });
    }

    // When subject changes, show sections
    subjectSelect.addEventListener('change', (e) => {
        const subject = e.target.value;
        const sectionsList = document.getElementById('sections-list');
        sectionsList.innerHTML = '';

        if (!subject) return;

        const sections = Object.keys(ALL_QUESTIONS[subject]).sort();
        sections.forEach(section => {
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = section;
            label.appendChild(cb);
            label.appendChild(document.createTextNode(' ' + section));
            sectionsList.appendChild(label);
        });
    });

    // Start quiz
    document.getElementById('start-quiz-btn').addEventListener('click', () => {
        const subject = subjectSelect.value;
    const selectedSections = Array.from(document.querySelectorAll('#sections-list input:checked')).map(cb => cb.value);
    showFeedback = document.getElementById('show-feedback').checked;

    if (!subject || selectedSections.length === 0) {
        alert('Please select a subject and at least one section');
        return;
    }

    // Build quiz with selected sections
    currentQuiz = [];
    selectedSections.forEach(section => {
        currentQuiz.push(...ALL_QUESTIONS[subject][section]);
    });

    // Shuffle questions every time
    for (let i = currentQuiz.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuiz[i], currentQuiz[j]] = [currentQuiz[j], currentQuiz[i]];
    }

    // Shuffle options for each question
    currentQuiz.forEach(q => {
        if (q.options && q.options.length > 0) {
            q.shuffledOptions = [...q.options];
            for (let i = q.shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [q.shuffledOptions[i], q.shuffledOptions[j]] = [q.shuffledOptions[j], q.shuffledOptions[i]];
            }
        }
    });

    userAnswers = new Array(currentQuiz.length).fill(null);
    currentIndex = 0;

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    document.getElementById('total').textContent = currentQuiz.length;
    showQuestion(0);
    });

    // Back button
    document.getElementById('back-btn').addEventListener('click', () => {
        if (confirm('Are you sure? Your progress will be lost.')) {
            location.reload();
        }
    });
}); // End DOMContentLoaded

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function showQuestion(index) {
    currentIndex = index;
    const q = currentQuiz[index];

    document.getElementById('current').textContent = index + 1;

    const container = document.getElementById('question-container');
    container.innerHTML = '';

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.textContent = (index + 1) + '. ' + q.question;
    container.appendChild(qText);

    // Handle EXTENDED question types
    if (q.type === 'Ordering') {
        const items = q.shuffledItems || shuffleArray([...q.items]);
        if (!q.shuffledItems) q.shuffledItems = items;
        if (!userAnswers[index]) userAnswers[index] = items.map((item, i) => ({item, position: i}));

        const orderedList = document.createElement('div');
        orderedList.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
        userAnswers[index].forEach((itemData, pos) => {
            const itemDiv = document.createElement('div');
            itemDiv.draggable = true;
            itemDiv.dataset.position = pos;
            itemDiv.style.cssText = 'padding:12px;background:white;border:2px solid #d2d2d7;border-radius:8px;cursor:move;';
            itemDiv.textContent = (pos+1) + '. ' + itemData.item;
            itemDiv.addEventListener('dragstart', (e) => {e.dataTransfer.setData('text/plain', pos); itemDiv.style.opacity='0.5';});
            itemDiv.addEventListener('dragend', () => itemDiv.style.opacity='1');
            itemDiv.addEventListener('dragover', (e) => e.preventDefault());
            itemDiv.addEventListener('drop', (e) => {
                e.preventDefault();
                const fromPos = parseInt(e.dataTransfer.getData('text/plain'));
                const toPos = parseInt(itemDiv.dataset.position);
                if (fromPos !== toPos) {
                    [userAnswers[index][fromPos], userAnswers[index][toPos]] = [userAnswers[index][toPos], userAnswers[index][fromPos]];
                    showQuestion(index);
                }
            });
            orderedList.appendChild(itemDiv);
        });
        container.appendChild(orderedList);
        const hint = document.createElement('div');
        hint.style.cssText = 'color:#86868b;font-size:14px;margin-top:8px;';
        hint.textContent = '💡 Drag items to reorder';
        container.appendChild(hint);
    } else if (q.type === 'Matching') {
        // Drag-and-drop matching: Terms on left, draggable match bubbles on right
        const shuffledMatches = q.shuffledMatches || shuffleArray([...q.pairs.map(p => p.match)]);
        if (!q.shuffledMatches) q.shuffledMatches = shuffledMatches;
        if (!userAnswers[index]) {
            userAnswers[index] = {};
            // Initialize with unmatched bubbles
            shuffledMatches.forEach(m => userAnswers[index][m] = null); // null means in bubble bank
        }

        const matchContainer = document.createElement('div');
        matchContainer.style.cssText = 'display:grid;gap:16px;';

        // Create term drop zones on the left
        q.pairs.forEach(pair => {
            const termBox = document.createElement('div');
            termBox.style.cssText = 'background:#f5f5f7;border-radius:12px;padding:16px;border:3px dashed #d2d2d7;min-height:70px;';
            termBox.dataset.term = pair.term;

            const termLabel = document.createElement('div');
            termLabel.style.cssText = 'font-weight:600;margin-bottom:8px;color:#1d1d1f;';
            termLabel.textContent = pair.term;
            termBox.appendChild(termLabel);

            // Show matched bubble if exists
            const matchedBubble = Object.entries(userAnswers[index]).find(([match, term]) => term === pair.term);
            if (matchedBubble) {
                const bubble = createMatchBubble(matchedBubble[0], index);
                termBox.appendChild(bubble);
            }

            // Drop zone handlers
            termBox.addEventListener('dragover', (e) => {e.preventDefault(); termBox.style.borderColor='#007aff';});
            termBox.addEventListener('dragleave', () => termBox.style.borderColor='#d2d2d7');
            termBox.addEventListener('drop', (e) => {
                e.preventDefault();
                termBox.style.borderColor='#d2d2d7';
                const matchText = e.dataTransfer.getData('text/plain');
                // Remove from previous location
                Object.keys(userAnswers[index]).forEach(key => {if (userAnswers[index][key] === pair.term) userAnswers[index][key] = null;});
                // Assign to this term
                userAnswers[index][matchText] = pair.term;
                showQuestion(index);
                updateNavButton();
            });

            matchContainer.appendChild(termBox);
        });
        container.appendChild(matchContainer);

        // Bubble bank for unmatched items
        const bubbleBank = document.createElement('div');
        bubbleBank.style.cssText = 'margin-top:20px;padding:16px;background:#e8f4f8;border-radius:12px;min-height:60px;';
        const bankLabel = document.createElement('div');
        bankLabel.style.cssText = 'font-weight:600;margin-bottom:12px;color:#1d1d1f;';
        bankLabel.textContent = '💭 Drag these matches to the terms above:';
        bubbleBank.appendChild(bankLabel);

        const bubblesContainer = document.createElement('div');
        bubblesContainer.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
        Object.entries(userAnswers[index]).forEach(([match, term]) => {
            if (term === null) { // Unmatched
                const bubble = createMatchBubble(match, index);
                bubblesContainer.appendChild(bubble);
            }
        });
        bubbleBank.appendChild(bubblesContainer);
        container.appendChild(bubbleBank);

        // Helper to create draggable bubble
        function createMatchBubble(matchText, qIndex) {
            const bubble = document.createElement('div');
            bubble.draggable = true;
            bubble.textContent = matchText;
            bubble.style.cssText = 'display:inline-block;padding:10px 16px;background:#007aff;color:white;border-radius:20px;cursor:move;font-size:14px;font-weight:500;user-select:none;';
            bubble.addEventListener('dragstart', (e) => {e.dataTransfer.setData('text/plain', matchText); bubble.style.opacity='0.5';});
            bubble.addEventListener('dragend', () => bubble.style.opacity='1');
            bubble.addEventListener('click', () => {
                // Click to return to bank
                userAnswers[qIndex][matchText] = null;
                showQuestion(qIndex);
                updateNavButton();
            });
            return bubble;
        }
    } else if (q.type === 'Fill-Blank') {
        if (!userAnswers[index]) userAnswers[index] = new Array(q.answers.length).fill('');
        const textParts = q.text_with_blanks.split('{{blank}}');
        const fillContainer = document.createElement('div');
        fillContainer.style.cssText = 'font-size:16px;line-height:2;';
        textParts.forEach((part, i) => {
            const textSpan = document.createElement('span');
            textSpan.textContent = part;
            fillContainer.appendChild(textSpan);
            if (i < textParts.length - 1) {
                const input = document.createElement('input');
                input.type = 'text';
                input.style.cssText = 'padding:6px 12px;border:2px solid #d2d2d7;border-radius:6px;min-width:120px;margin:0 4px;';
                input.value = userAnswers[index][i] || '';
                input.placeholder = 'Blank ' + (i+1);
                input.addEventListener('input', (e) => {userAnswers[index][i] = e.target.value; updateNavButton();});
                fillContainer.appendChild(input);
            }
        });
        container.appendChild(fillContainer);
    } else if (q.type === 'Categorization') {
        // Drag-and-drop categorization: Category drop zones + draggable item bubbles
        const shuffledItems = q.shuffledItems || shuffleArray([...q.items]);
        if (!q.shuffledItems) q.shuffledItems = shuffledItems;
        if (!userAnswers[index]) {
            userAnswers[index] = {};
            shuffledItems.forEach(item => userAnswers[index][item.text] = null); // null means uncategorized
        }

        const catContainer = document.createElement('div');
        catContainer.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;';

        // Create category drop zones
        q.categories.forEach(category => {
            const catZone = document.createElement('div');
            catZone.style.cssText = 'background:#f5f5f7;border-radius:12px;padding:16px;border:3px dashed #d2d2d7;min-height:100px;';
            catZone.dataset.category = category;

            const catLabel = document.createElement('div');
            catLabel.style.cssText = 'font-weight:600;margin-bottom:12px;color:#1d1d1f;text-align:center;';
            catLabel.textContent = category;
            catZone.appendChild(catLabel);

            const itemsInCat = document.createElement('div');
            itemsInCat.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
            // Show items assigned to this category
            Object.entries(userAnswers[index]).forEach(([itemText, cat]) => {
                if (cat === category) {
                    const bubble = createCatBubble(itemText, index);
                    itemsInCat.appendChild(bubble);
                }
            });
            catZone.appendChild(itemsInCat);

            // Drop zone handlers
            catZone.addEventListener('dragover', (e) => {e.preventDefault(); catZone.style.borderColor='#007aff';catZone.style.background='#e8f4f8';});
            catZone.addEventListener('dragleave', () => {catZone.style.borderColor='#d2d2d7';catZone.style.background='#f5f5f7';});
            catZone.addEventListener('drop', (e) => {
                e.preventDefault();
                catZone.style.borderColor='#d2d2d7';
                catZone.style.background='#f5f5f7';
                const itemText = e.dataTransfer.getData('text/plain');
                userAnswers[index][itemText] = category;
                showQuestion(index);
                updateNavButton();
            });

            catContainer.appendChild(catZone);
        });
        container.appendChild(catContainer);

        // Bubble bank for uncategorized items
        const bubbleBank = document.createElement('div');
        bubbleBank.style.cssText = 'padding:16px;background:#e8f4f8;border-radius:12px;min-height:60px;';
        const bankLabel = document.createElement('div');
        bankLabel.style.cssText = 'font-weight:600;margin-bottom:12px;color:#1d1d1f;';
        bankLabel.textContent = '💭 Drag these items to the categories above:';
        bubbleBank.appendChild(bankLabel);

        const bubblesContainer = document.createElement('div');
        bubblesContainer.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
        Object.entries(userAnswers[index]).forEach(([itemText, cat]) => {
            if (cat === null) { // Uncategorized
                const bubble = createCatBubble(itemText, index);
                bubblesContainer.appendChild(bubble);
            }
        });
        bubbleBank.appendChild(bubblesContainer);
        container.appendChild(bubbleBank);

        // Helper to create draggable bubble
        function createCatBubble(itemText, qIndex) {
            const bubble = document.createElement('div');
            bubble.draggable = true;
            bubble.textContent = itemText;
            bubble.style.cssText = 'display:inline-block;padding:10px 16px;background:#34c759;color:white;border-radius:20px;cursor:move;font-size:14px;font-weight:500;user-select:none;';
            bubble.addEventListener('dragstart', (e) => {e.dataTransfer.setData('text/plain', itemText); bubble.style.opacity='0.5';});
            bubble.addEventListener('dragend', () => bubble.style.opacity='1');
            bubble.addEventListener('click', () => {
                // Click to return to bank
                userAnswers[qIndex][itemText] = null;
                showQuestion(qIndex);
                updateNavButton();
            });
            return bubble;
        }
    } else if (q.type === 'Short Answer') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'answer-input';
        input.value = userAnswers[index] || '';
        input.addEventListener('input', (e) => {
            userAnswers[index] = e.target.value;
            updateNavButton();
        });
        container.appendChild(input);
    } else {
        const ul = document.createElement('ul');
        ul.className = 'options-list';
        const inputType = q.type === 'Multiple Choice' ? 'checkbox' : 'radio';
        const options = q.shuffledOptions || q.options;

        options.forEach(opt => {
            const li = document.createElement('li');
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = inputType;
            input.name = 'q' + index;
            input.value = opt;

            if (q.type === 'Multiple Choice') {
                const current = userAnswers[index] || [];
                input.checked = current.includes(opt);
                input.addEventListener('change', (e) => {
                    if (!userAnswers[index]) userAnswers[index] = [];
                    if (e.target.checked) {
                        if (!userAnswers[index].includes(opt)) userAnswers[index].push(opt);
                    } else {
                        userAnswers[index] = userAnswers[index].filter(a => a !== opt);
                    }
                    updateNavButton();
                });
            } else {
                input.checked = userAnswers[index] === opt;
                input.addEventListener('change', (e) => {
                    if (e.target.checked) userAnswers[index] = opt;
                    updateNavButton();
                });
            }

            label.appendChild(input);
            label.appendChild(document.createTextNode(opt));
            li.appendChild(label);
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    // Show existing feedback if revisiting
    if (showFeedback && userAnswers[index] !== null && container.querySelector('.feedback') === null) {
        const existing = document.getElementById('question-container').dataset.feedbackShown;
        if (existing === String(index)) {
            showQuestionFeedback(index);
        }
    }

    updateNavButton();
}

function showQuestionFeedback(index) {
    const q = currentQuiz[index];
    const userAns = userAnswers[index];
    const container = document.getElementById('question-container');

    if (container.querySelector('.feedback')) return;

    const isCorrect = gradeAnswer(q, userAns);
    const feedback = document.createElement('div');
    feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');

    if (isCorrect) {
        feedback.innerHTML = '<strong>✓ Correct!</strong>';
    } else {
        feedback.innerHTML = '<strong>✗ Incorrect.</strong> Correct: ' + formatAnswer(q.correct_answer);
    }

    if (q.feedback) {
        feedback.innerHTML += '<br><br>' + q.feedback;
    }

    container.appendChild(feedback);
    container.dataset.feedbackShown = index;
}

function updateNavButton() {
    const btn = document.getElementById('next-btn');
    const feedbackExists = document.getElementById('question-container').querySelector('.feedback');

    if (showFeedback && userAnswers[currentIndex] !== null && !feedbackExists) {
        btn.textContent = 'Check Answer';
        btn.onclick = () => {
            showQuestionFeedback(currentIndex);
            updateNavButton();
        };
    } else if (currentIndex < currentQuiz.length - 1) {
        btn.textContent = 'Next →';
        btn.onclick = () => showQuestion(currentIndex + 1);
    } else {
        btn.textContent = 'Finish Quiz';
        btn.onclick = finishQuiz;
    }
}

function gradeAnswer(q, userAns) {
    if (!userAns) return false;

    // Extended question types
    if (q.type === 'Ordering') {
        const userOrder = userAns.map(item => q.items.indexOf(item.item));
        return JSON.stringify(userOrder) === JSON.stringify(q.correct_order);
    }
    if (q.type === 'Matching') {
        return q.pairs.every(pair => userAns[pair.term] === pair.match);
    }
    if (q.type === 'Fill-Blank') {
        const caseSensitive = q.case_sensitive || false;
        return q.answers.every((ans, i) => {
            const userAnswer = userAns[i] || '';
            if (caseSensitive) {
                return userAnswer.trim() === ans.trim();
            } else {
                return userAnswer.trim().toLowerCase() === ans.trim().toLowerCase();
            }
        });
    }
    if (q.type === 'Categorization') {
        return q.items.every(item => userAns[item.text] === item.category);
    }

    // Traditional question types
    if (q.type === 'Multiple Choice') {
        const correct = new Set(Array.isArray(q.correct_answer) ? q.correct_answer : q.correct_answer.split(';').map(a => a.trim()));
        const user = new Set(Array.isArray(userAns) ? userAns : [userAns]);
        return correct.size === user.size && [...correct].every(a => user.has(a));
    }
    if (q.type === 'Short Answer') {
        // Split by semicolon to support multiple acceptable answers
        const acceptableAnswers = String(q.correct_answer).split(';').map(a => a.trim().toLowerCase());
        const userAnswer = String(userAns).trim().toLowerCase();
        return acceptableAnswers.includes(userAnswer);
    }
    return String(q.correct_answer) === String(userAns);
}

function formatAnswer(ans) {
    return Array.isArray(ans) ? ans.join('; ') : ans;
}

function finishQuiz() {
    let correct = 0;
    currentQuiz.forEach((q, i) => {
        if (gradeAnswer(q, userAnswers[i])) correct++;
    });

    const results = document.getElementById('results');
    const pct = Math.round((correct / currentQuiz.length) * 100);

    let html = '<div class="score-summary">Score: ' + correct + '/' + currentQuiz.length + ' (' + pct + '%)</div>';

    currentQuiz.forEach((q, i) => {
        const isCorrect = gradeAnswer(q, userAnswers[i]);
        html += '<div class="result-item ' + (isCorrect ? 'correct' : 'incorrect') + '">';
        html += '<div style="font-weight:bold">' + (i+1) + '. ' + q.question + '</div>';
        html += '<div>Your answer: ' + formatAnswer(userAnswers[i] || '(no answer)') + '</div>';
        if (!isCorrect) {
            html += '<div style="color:#28a745">Correct: ' + formatAnswer(q.correct_answer) + '</div>';
        }
        if (q.feedback) {
            html += '<div class="feedback">' + q.feedback + '</div>';
        }
        html += '</div>';
    });

    html += '<button class="btn-primary" onclick="location.reload()">New Quiz</button>';

    results.innerHTML = html;
    results.classList.remove('hidden');
    document.getElementById('question-container').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
}


// Service worker
if ('serviceWorker' in navigator) {
    const swCode = `
self.addEventListener('install', (event) => {
    event.waitUntil(caches.open('quiz-v1').then(cache => cache.addAll(['/'])));
});
self.addEventListener('fetch', (event) => {
    event.respondWith(caches.match(event.request).then(r => r || fetch(event.request)));
});
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
}
