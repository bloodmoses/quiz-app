<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Study Quiz">
    <title>Study Quiz</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #1d1d1f;
    background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 25%, #6C5B7B 50%, #355C7D 100%);
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 1px rgba(0,0,0,0.1);
}
.header {
    text-align: center;
    margin-bottom: 32px;
}
h1 {
    color: #1d1d1f;
    margin-bottom: 8px;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.5px;
}
.subtitle {
    font-size: 15px;
    font-style: italic;
    color: #86868b;
    font-weight: 400;
}
.form-group {
    margin-bottom: 24px;
}
.form-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #1d1d1f;
}
.form-control {
    width: 100%;
    padding: 14px;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    background: #f5f5f7;
    transition: all 0.25s ease;
}
.form-control:focus {
    outline: none;
    border-color: #FF6B9D;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
}
.checkbox-list {
    max-height: 300px;
    overflow-y: auto;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    padding: 12px;
    background: #f5f5f7;
}
.checkbox-list label {
    display: block;
    padding: 10px;
    cursor: pointer;
    font-weight: normal;
    border-radius: 8px;
    transition: all 0.2s ease;
}
.checkbox-list label:hover {
    background: rgba(255, 107, 157, 0.1);
}
.checkbox-list input {
    margin-right: 10px;
    accent-color: #FF6B9D;
}
.btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
}
.btn-primary:active {
    transform: translateY(0);
}
.btn-back {
    padding: 10px 18px;
    background: #86868b;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}
.btn-back:hover {
    background: #6e6e73;
    transform: translateY(-1px);
}
.hidden { display: none !important; }
.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}
.quiz-progress {
    color: #86868b;
    font-size: 14px;
    font-weight: 500;
}
#question-container {
    margin: 30px 0;
    padding: 24px;
    background: #f5f5f7;
    border-radius: 12px;
}
.question-text {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.3px;
}
.options-list {
    list-style: none;
}
.options-list li {
    margin-bottom: 12px;
}
.options-list label {
    display: flex;
    align-items: center;
    padding: 16px;
    background: white;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
}
.options-list label:hover {
    border-color: #FF6B9D;
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.15);
}
.options-list input {
    margin-right: 12px;
    accent-color: #FF6B9D;
}
.answer-input {
    width: 100%;
    padding: 16px;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    background: #f5f5f7;
    transition: all 0.25s ease;
}
.answer-input:focus {
    outline: none;
    border-color: #FF6B9D;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
}
.feedback {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    border-left: 4px solid #FFC107;
    background: rgba(255, 193, 7, 0.15);
}
.feedback.correct {
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    border-left-color: #34C759;
}
.feedback.incorrect {
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
    border-left-color: #FF3B30;
}
.nav-buttons {
    margin-top: 24px;
}
#results {
    margin-top: 32px;
}
.score-summary {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.5px;
}
.result-item {
    margin-bottom: 16px;
    padding: 20px;
    background: #f5f5f7;
    border-radius: 12px;
    border-left: 4px solid #d2d2d7;
    transition: all 0.25s ease;
}
.result-item:hover {
    transform: translateX(4px);
}
.result-item.correct {
    border-left-color: #34C759;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
}
.result-item.incorrect {
    border-left-color: #FF3B30;
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
}
.answer-row { display: block; margin: 16px 0; }
.answer-row select { margin-top: 6px; }
.fill-blanks { line-height: 2.8; }
.fill-blanks input { max-width: 100%; width: 150px; padding: 8px; margin: 4px; font-size: 16px; }
.result-item p { margin-top: 8px; white-space: pre-wrap; }

    </style>
</head>
<body>
    <div class="container">
        <!-- Setup Screen -->
        <div id="setup-screen">
            <div class="header">
                <h1>Study Quiz</h1>
            </div>

            <div class="form-group">
                <label>Subject:</label>
                <select id="subject-select" class="form-control">
                    <option value="">-- Select Subject --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sections (pick one or more):</label>
                <div id="sections-list" class="checkbox-list"></div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="show-feedback" checked>
                    Show feedback after each question
                </label>
            </div>

            <button id="start-quiz-btn" class="btn-primary">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <button id="back-btn" class="btn-back">← Back to Setup</button>
                <div class="quiz-progress">
                    Question <span id="current">1</span> / <span id="total">0</span>
                </div>
            </div>

            <div id="question-container"></div>

            <div class="nav-buttons">
                <button id="next-btn" class="btn-primary">Next →</button>
            </div>

            <div id="results" class="hidden"></div>
        </div>
    </div>

// Shared by preview and the published quiz. No server-side duplicate.
function gradeAnswer(q, answer) {
    if (answer === null || answer === undefined) return false;
    const normalize = value => String(value).trim().toLowerCase();
    switch (q.type) {
        case 'Ordering':
            return Array.isArray(answer) && answer.length === q.correct_order.length &&
                answer.every((value, i) => value === q.correct_order[i]);
        case 'Matching':
            return q.pairs.every((pair, i) => answer[i] === pair.match);
        case 'Categorization':
            return q.items.every((item, i) => answer[i] === item.category);
        case 'Fill-Blank':
            return q.answers.every((expected, i) => {
                const value = String(answer[i] ?? '').trim();
                return value !== '' && (q.case_sensitive
                    ? value === expected.trim() : normalize(value) === normalize(expected));
            });
        case 'Multiple Choice': {
            const expected = new Set(Array.isArray(q.correct_answer) ? q.correct_answer : q.correct_answer.split(';').map(a => a.trim()));
            const actual = new Set(Array.isArray(answer) ? answer : [answer]);
            return expected.size === actual.size && [...expected].every(a => actual.has(a));
        }
        case 'Short Answer': {
            const expected = Array.isArray(q.correct_answer) ? q.correct_answer : q.correct_answer.split(';');
            return normalize(answer) !== '' && expected.some(a => normalize(a) === normalize(answer));
        }
        default:
            return answer === q.correct_answer;
    }
}

function correctAnswerText(q) {
    switch (q.type) {
        case 'Ordering': return q.correct_order.map(i => q.items[i]).join(' → ');
        case 'Matching': return q.pairs.map(p => `${p.term}: ${p.match}`).join('; ');
        case 'Categorization': return q.items.map(i => `${i.text}: ${i.category}`).join('; ');
        case 'Fill-Blank': return q.answers.join('; ');
        default: return Array.isArray(q.correct_answer) ? q.correct_answer.join('; ') : q.correct_answer;
    }
}

function userAnswerText(q, answer) {
    if (answer === null || answer === undefined || answer === '') return '(no answer)';
    if (q.type === 'Ordering') return answer.map(i => q.items[i] ?? '(no answer)').join(' → ');
    if (q.type === 'Matching') return q.pairs.map((p, i) => `${p.term}: ${answer[i] || '(no answer)'}`).join('; ');
    if (q.type === 'Categorization') return q.items.map((item, i) => `${item.text}: ${answer[i] || '(no answer)'}`).join('; ');
    return Array.isArray(answer) ? answer.map(a => a || '(no answer)').join('; ') : String(answer);
}

if (typeof module !== 'undefined') module.exports = { gradeAnswer, correctAnswerText, userAnswerText };

        container.append(paragraph);
    } else if (q.type === 'Ordering') {
        const answers = Array(q.items.length).fill(null);
        setAnswer(answers);
        const options = shuffle(q.items.map((text, value) => ({text, value})));
        q.items.forEach((_, i) => container.append(selectAnswer(`Position ${i + 1}`, options, value => { answers[i] = Number(value); })));
    } else if (q.type === 'Matching' || q.type === 'Categorization') {
        const matching = q.type === 'Matching';
        const items = matching ? q.pairs : q.items;
        const answers = Array(items.length).fill('');
        setAnswer(answers);
        const choices = matching ? shuffle([...new Set(q.pairs.map(p => p.match))]) : q.categories;
        const options = choices.map(text => ({text, value: text}));
        items.forEach((item, i) => container.append(selectAnswer(matching ? item.term : item.text, options, value => { answers[i] = value; })));
    } else {
        const multiple = q.type === 'Multiple Choice';
        const answers = [];
        const list = element('ul', undefined, 'options-list');
        shuffle(q.options).forEach(option => {
            const li = element('li');
            const label = element('label');
            const input = element('input');
            input.type = multiple ? 'checkbox' : 'radio';
            input.name = 'answer';
            input.addEventListener('change', () => {
                if (!multiple) return setAnswer(option);
                if (input.checked) answers.push(option);
                else answers.splice(answers.indexOf(option), 1);
                setAnswer([...answers]);
            });
            label.append(input, document.createTextNode(option));
            li.append(label);
            list.append(li);
        });
        container.append(list);
    }
    updateButton();
}
function updateButton() {
    $('next-btn').textContent = showFeedback && !checked ? 'Check Answer' :
        currentIndex === currentQuiz.length - 1 ? 'Finish Quiz' : 'Next →';
}
function checkAnswer() {
    const q = currentQuiz[currentIndex];
    const correct = gradeAnswer(q, userAnswers[currentIndex]);
    const feedback = element('div', correct ? 'Correct!' : `Incorrect. Correct answer: ${correctAnswerText(q)}`, `feedback ${correct ? 'correct' : 'incorrect'}`);
    if (q.feedback) feedback.append(element('p', q.feedback));
    $('question-container').append(feedback);
    // Keep the displayed feedback and final score consistent.
    $('question-container').querySelectorAll('input, select').forEach(input => { input.disabled = true; });
    checked = true;
    updateButton();
}
function finishQuiz() {
    const results = $('results');
    const count = currentQuiz.filter((q, i) => gradeAnswer(q, userAnswers[i])).length;
    results.replaceChildren(element('div', `Score: ${count}/${currentQuiz.length} (${Math.round(count / currentQuiz.length * 100)}%)`, 'score-summary'));
    currentQuiz.forEach((q, i) => {
        const correct = gradeAnswer(q, userAnswers[i]);
        const item = element('div', undefined, `result-item ${correct ? 'correct' : 'incorrect'}`);
        item.append(element('strong', `${i + 1}. ${q.question}`), element('p', `Your answer: ${userAnswerText(q, userAnswers[i])}`));
        if (!correct) item.append(element('p', `Correct answer: ${correctAnswerText(q)}`));
        if (q.feedback) item.append(element('p', q.feedback));
        results.append(item);
    });
    const restart = element('button', 'New Quiz', 'btn-primary');
    restart.onclick = () => location.reload();
    results.append(restart);
    results.classList.remove('hidden');
    $('question-container').classList.add('hidden');
    $('next-btn').classList.add('hidden');
}

document.addEventListener('DOMContentLoaded', () => {
    const subjects = [...new Set(ALL_QUESTIONS.map(q => q.subject))].sort();
    subjects.forEach(subject => $('subject-select').append(new Option(subject, subject)));
    $('subject-select').addEventListener('change', () => {
        $('sections-list').replaceChildren();
        const sections = [...new Set(ALL_QUESTIONS.filter(q => q.subject === $('subject-select').value).map(q => q.section))].sort();
        sections.forEach(section => {
            const label = element('label');
            const checkbox = element('input');
            checkbox.type = 'checkbox';
            checkbox.value = section;
            checkbox.checked = true;
            label.append(checkbox, document.createTextNode(` ${section}`));
            $('sections-list').append(label);
        });
    });
    $('start-quiz-btn').onclick = () => {
        const sections = [...$('sections-list').querySelectorAll('input:checked')].map(cb => cb.value);
        currentQuiz = shuffle(ALL_QUESTIONS.filter(q => q.subject === $('subject-select').value && sections.includes(q.section)));
        if (!currentQuiz.length) return alert('Choose a subject and at least one section.');
        userAnswers = Array(currentQuiz.length).fill(null);
        currentIndex = 0;
        showFeedback = $('show-feedback').checked;
        $('setup-screen').classList.add('hidden');
        $('quiz-screen').classList.remove('hidden');
        $('total').textContent = currentQuiz.length;
        showQuestion();
    };
    $('next-btn').onclick = () => {
        if (showFeedback && !checked) return checkAnswer();
        if (currentIndex === currentQuiz.length - 1) return finishQuiz();
        currentIndex++;
        showQuestion();
    };
    $('back-btn').onclick = () => { if (confirm('Return to setup? Your current answers will be cleared.')) location.reload(); };
    if (subjects.length === 1) {
        $('subject-select').value = subjects[0];
        $('subject-select').dispatchEvent(new Event('change'));
    }
});


    </script>
