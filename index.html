<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Study Quiz">
    <title>Study Quiz</title>
    <style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    color: #1d1d1f;
    background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 25%, #6C5B7B 50%, #355C7D 100%);
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 1px rgba(0,0,0,0.1);
}
.header {
    text-align: center;
    margin-bottom: 32px;
}
h1 {
    color: #1d1d1f;
    margin-bottom: 8px;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.5px;
}
.subtitle {
    font-size: 15px;
    font-style: italic;
    color: #86868b;
    font-weight: 400;
}
.form-group {
    margin-bottom: 24px;
}
.form-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #1d1d1f;
}
.form-control {
    width: 100%;
    padding: 14px;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    background: #f5f5f7;
    transition: all 0.25s ease;
}
.form-control:focus {
    outline: none;
    border-color: #FF6B9D;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
}
.checkbox-list {
    max-height: 300px;
    overflow-y: auto;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    padding: 12px;
    background: #f5f5f7;
}
.checkbox-list label {
    display: block;
    padding: 10px;
    cursor: pointer;
    font-weight: normal;
    border-radius: 8px;
    transition: all 0.2s ease;
}
.checkbox-list label:hover {
    background: rgba(255, 107, 157, 0.1);
}
.checkbox-list input {
    margin-right: 10px;
    accent-color: #FF6B9D;
}
.btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #FF6B9D 0%, #C06C84 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
}
.btn-primary:active {
    transform: translateY(0);
}
.btn-back {
    padding: 10px 18px;
    background: #86868b;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}
.btn-back:hover {
    background: #6e6e73;
    transform: translateY(-1px);
}
.hidden { display: none !important; }
.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}
.quiz-progress {
    color: #86868b;
    font-size: 14px;
    font-weight: 500;
}
#question-container {
    margin: 30px 0;
    padding: 24px;
    background: #f5f5f7;
    border-radius: 12px;
}
.question-text {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.3px;
}
.options-list {
    list-style: none;
}
.options-list li {
    margin-bottom: 12px;
}
.options-list label {
    display: flex;
    align-items: center;
    padding: 16px;
    background: white;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
}
.options-list label:hover {
    border-color: #FF6B9D;
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.15);
}
.options-list input {
    margin-right: 12px;
    accent-color: #FF6B9D;
}
.answer-input {
    width: 100%;
    padding: 16px;
    border: 2px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    background: #f5f5f7;
    transition: all 0.25s ease;
}
.answer-input:focus {
    outline: none;
    border-color: #FF6B9D;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
}
.feedback {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    border-left: 4px solid #FFC107;
    background: rgba(255, 193, 7, 0.15);
}
.feedback.correct {
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    border-left-color: #34C759;
}
.feedback.incorrect {
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
    border-left-color: #FF3B30;
}
.nav-buttons {
    margin-top: 24px;
}
#results {
    margin-top: 32px;
}
.score-summary {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.5px;
}
.result-item {
    margin-bottom: 16px;
    padding: 20px;
    background: #f5f5f7;
    border-radius: 12px;
    border-left: 4px solid #d2d2d7;
    transition: all 0.25s ease;
}
.result-item:hover {
    transform: translateX(4px);
}
.result-item.correct {
    border-left-color: #34C759;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
}
.result-item.incorrect {
    border-left-color: #FF3B30;
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
}

    </style>
</head>
<body>
    <div class="container">
        <!-- Setup Screen -->
        <div id="setup-screen">
            <div class="header">
                <h1>QuickQuiz</h1>
            </div>

            <div class="form-group">
                <label>Subject:</label>
                <select id="subject-select" class="form-control">
                    <option value="">-- Select Subject --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sections (pick one or more):</label>
                <div id="sections-list" class="checkbox-list"></div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="show-feedback" checked>
                    Show feedback after each question
                </label>
            </div>

            <button id="start-quiz-btn" class="btn-primary">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <button id="back-btn" class="btn-back">← Back to Setup</button>
                <div class="quiz-progress">
                    Question <span id="current">1</span> / <span id="total">0</span>
                </div>
            </div>

            <div id="question-container"></div>

            <div class="nav-buttons">
                <button id="next-btn" class="btn-primary">Next →</button>
            </div>

            <div id="results" class="hidden"></div>
        </div>
    </div>

    <script>
// All questions organized by subject/section
const ALL_QUESTIONS = {"Science": {"Topic 6 - Populations, Communities, and Ecosystems": [{"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What term describes the role of an organism in its habitat?", "type": "Single Choice", "options": ["Population", "Niche", "Predation", "Succession"], "correct_answer": "Niche", "feedback": "A niche is an organism's role in its habitat, including how it gets food and survives."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "A niche includes how an organism gets food, when and how it reproduces, and the physical conditions it needs to survive.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The lesson defines a niche as much more than just where an organism lives."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What is competition in an ecosystem?", "type": "Single Choice", "options": ["The struggle between organisms to survive using the same limited resources", "A relationship in which both species benefit", "A series of predictable changes in a community over time", "The disappearance of a species from Earth"], "correct_answer": "The struggle between organisms to survive using the same limited resources", "feedback": "Competition happens when organisms use the same limited resources."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Species that share a habitat often have adaptations that help reduce competition.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The slides explain that shared habitats often lead to adaptations that reduce competition."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "In a predator-prey relationship, the organism that is hunted is called the ____.", "type": "Short Answer", "options": [], "correct_answer": "prey", "feedback": "The predator does the hunting; the prey is hunted."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What is predation?", "type": "Single Choice", "options": ["A relationship in which one organism kills another for food or nutrients", "A relationship in which one organism benefits and the other is unaffected", "A form of succession that happens after a fire", "The movement of organisms to a new habitat"], "correct_answer": "A relationship in which one organism kills another for food or nutrients", "feedback": "Predation is an interaction in which a predator kills prey for food or nutrients."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Camouflage, warning coloration, and protective coverings can help prey avoid being killed.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "These are examples of prey adaptations that improve survival."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Symbiosis is:", "type": "Single Choice", "options": ["Any relationship in which two species live closely together", "A type of competition for food", "A rapid change in climate", "The first stage of succession"], "correct_answer": "Any relationship in which two species live closely together", "feedback": "The lesson defines symbiosis as any close relationship between two species."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which symbiotic relationship benefits one species while the other species is neither helped nor harmed?", "type": "Single Choice", "options": ["Commensalism", "Mutualism", "Parasitism", "Predation"], "correct_answer": "Commensalism", "feedback": "In commensalism, one species benefits and the other is unaffected."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which symbiotic relationship benefits both species?", "type": "Single Choice", "options": ["Commensalism", "Mutualism", "Parasitism", "Competition"], "correct_answer": "Mutualism", "feedback": "Mutualism means both species benefit from the relationship."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which relationship involves one organism living on, in, or inside another organism and harming it?", "type": "Single Choice", "options": ["Commensalism", "Mutualism", "Parasitism", "Predation"], "correct_answer": "Parasitism", "feedback": "Parasitism benefits one organism while harming the host."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Primary succession occurs in an area where:", "type": "Single Choice", "options": ["No soil or organisms exist", "A fire has left the soil in place", "A predator has removed prey", "Two species share a niche"], "correct_answer": "No soil or organisms exist", "feedback": "Primary succession starts where there is no soil and no existing community."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which organisms are commonly pioneer species during primary succession?", "type": "Multiple Choice", "options": ["Lichens", "Mosses", "Oak trees", "Wolves"], "correct_answer": ["Lichens", "Mosses"], "feedback": "Pioneer species are usually lichens and mosses, which help begin soil formation."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Secondary succession happens more quickly than primary succession because soil is already present.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Secondary succession begins after a disturbance in an area where soil already exists."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Longleaf pine trees are adapted to survive regular:", "type": "Single Choice", "options": ["Forest fires", "Avalanches", "Tsunamis", "Blizzards"], "correct_answer": "Forest fires", "feedback": "Longleaf pines depend on regular forest fires and have traits that help them survive them."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Biodiversity is the:", "type": "Single Choice", "options": ["Number and variety of different species in an area", "Amount of rainfall in a region", "Population size of one species", "Rate of succession in a habitat"], "correct_answer": "Number and variety of different species in an area", "feedback": "Healthy ecosystems have biodiversity, meaning many kinds of species."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "A keystone species is a species that:", "type": "Single Choice", "options": ["Influences the survival of many other species in an ecosystem", "Always lives at the top of a food chain", "Can survive without any competition", "Only lives in forests"], "correct_answer": "Influences the survival of many other species in an ecosystem", "feedback": "Keystone species help maintain ecosystem balance because many species depend on them."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Greater genetic diversity makes a species more likely to adapt and survive environmental change.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "More genetic variation improves a species' chances of adapting to new conditions."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "What is extinction?", "type": "Single Choice", "options": ["The disappearance of all members of a species from Earth", "A stable ecosystem with many species", "A temporary drop in population size", "A relationship between predator and prey"], "correct_answer": "The disappearance of all members of a species from Earth", "feedback": "Extinction means an entire species is gone from Earth."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Resources that are used but not consumed, such as shade from trees or recreation in habitats, have:", "type": "Single Choice", "options": ["Indirect value", "Direct value", "Genetic value", "Competitive value"], "correct_answer": "Indirect value", "feedback": "Indirect value comes from benefits we use without consuming the resource itself."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Mass extinction differs from background extinction because mass extinction:", "type": "Single Choice", "options": ["Kills many different species in a short time", "Usually affects only one species over a long period", "Always happens because of one predator", "Only happens in the ocean"], "correct_answer": "Kills many different species in a short time", "feedback": "Mass extinctions affect many species quickly, unlike background extinction."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Which human activity can reduce biodiversity?", "type": "Single Choice", "options": ["Deforestation", "Pollination", "Nutrient cycling", "Seed dispersal"], "correct_answer": "Deforestation", "feedback": "Removing habitats and natural resources can reduce biodiversity."}, {"subject": "Science", "section": "Topic 6 - Populations, Communities, and Ecosystems", "question": "Match each ecosystem interaction term to its correct description:", "type": "Matching", "pairs": [{"term": "Competition", "match": "The struggle between organisms to survive using the same limited resources"}, {"term": "Predation", "match": "One organism kills another for food or nutrients"}, {"term": "Mutualism", "match": "A symbiotic relationship in which both species benefit"}, {"term": "Commensalism", "match": "A symbiotic relationship in which one species benefits and the other is neither helped nor harmed"}, {"term": "Parasitism", "match": "A relationship in which one organism benefits while harming the host"}, {"term": "Diocletian", "match": "Divided the empire into four parts in an effort to reform it"}, {"term": "Constantine", "match": "Moved the capital to Constantinople and supported Christianity"}, {"term": "Justinian", "match": "Reorganized Byzantine law into the Justinian Code"}, {"term": "Theodora", "match": "Helped expand women's rights and urged Justinian to stay and fight an uprising"}], "feedback": "These terms describe major interactions and processes in Topic 6.", "options": []}]}, "History": {"Chapter 8 - The Rise of Rome": [{"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome was built near which river?", "type": "Single Choice", "options": ["Nile River", "Tiber River", "Danube River", "Euphrates River"], "correct_answer": "Tiber River", "feedback": "Rome grew beside the Tiber River at an easy crossing point."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome's seven hills made the city easier to defend from attack.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The steep hills helped protect the city."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Compared with Greece, Italy helped Rome grow because Italy had:", "type": "Single Choice", "options": ["Better farmland and mountains that were easier to cross", "More deserts and fewer rivers", "No nearby seas for trade", "Only small isolated valleys"], "correct_answer": "Better farmland and mountains that were easier to cross", "feedback": "Italy could support more people, and its geography did not isolate communities as much as Greece did."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Which people changed Rome from a village of huts into a city with streets, temples, and public buildings?", "type": "Single Choice", "options": ["Persians", "Etruscans", "Carthaginians", "Hebrews"], "correct_answer": "Etruscans", "feedback": "The Etruscans strongly influenced early Roman development."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "According to Roman legend, who founded Rome in 753 B.C.?", "type": "Single Choice", "options": ["Aeneas", "Hannibal", "Romulus", "Cincinnatus"], "correct_answer": "Romulus", "feedback": "Roman tradition says Romulus founded the city after quarreling with Remus."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome became a republic in 509 B.C. after the Romans overthrew Etruscan rule.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The republic replaced the Etruscan kings."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The smaller Roman army groups that could move quickly through enemy lines were called ____.", "type": "Short Answer", "options": [], "correct_answer": "legions", "feedback": "Roman armies were reorganized into legions for flexibility and control."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "What were Rome's wealthy landowners and nobles called?", "type": "Single Choice", "options": ["Plebeians", "Patricians", "Praetors", "Allies"], "correct_answer": "Patricians", "feedback": "Patricians made up Rome's ruling class."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "In the Roman Republic, the top government officials were the:", "type": "Single Choice", "options": ["Consuls", "Praetors", "Tribunes", "Senators"], "correct_answer": "Consuls", "feedback": "Two consuls headed the army and ran the government."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Each Roman consul could veto the other consul's decisions.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "The veto helped keep either consul from becoming too powerful."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Rome's first written code of laws was called the:", "type": "Single Choice", "options": ["Law of Nations", "Julian Code", "Twelve Tables", "Code of Hammurabi"], "correct_answer": "Twelve Tables", "feedback": "The Twelve Tables were Rome's first written laws and became the basis of later Roman law."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The Law of Nations helped spread the idea that accused people could defend themselves and were innocent until proven guilty.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Roman law promoted principles of justice that influenced later legal systems."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The First Punic War began because Rome and Carthage both wanted control of:", "type": "Single Choice", "options": ["Sicily", "Egypt", "Gaul", "Greece"], "correct_answer": "Sicily", "feedback": "Control of Sicily led Rome and Carthage into war in 264 B.C."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Hannibal attacked Italy by crossing the Alps during the Second Punic War.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Hannibal marched from Spain over the Alps into Italy."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "At which battle did Hannibal hand Rome one of its worst defeats in 216 B.C.?", "type": "Single Choice", "options": ["Zama", "Actium", "Cannae", "Adrianople"], "correct_answer": "Cannae", "feedback": "The Roman army suffered a devastating loss at Cannae."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "A political alliance of three people is called a:", "type": "Single Choice", "options": ["Republic", "Triumvirate", "Legion", "Province"], "correct_answer": "Triumvirate", "feedback": "Crassus, Pompey, and Caesar formed the First Triumvirate."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "The phrase \"crossing the Rubicon\" means making a decision that cannot be taken back.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Caesar crossed the Rubicon knowing it would trigger civil war."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Who defeated Antony and Cleopatra at the Battle of Actium?", "type": "Single Choice", "options": ["Hannibal", "Octavian", "Cicero", "Scipio"], "correct_answer": "Octavian", "feedback": "Octavian won at Actium and became the strongest leader in Rome."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Who became Rome's first emperor?", "type": "Single Choice", "options": ["Julius Caesar", "Augustus", "Nero", "Tiberius"], "correct_answer": "Augustus", "feedback": "Octavian took the title Augustus and became Rome's first emperor."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "What does Pax Romana mean?", "type": "Single Choice", "options": ["Roman Law", "Roman Peace", "Roman Senate", "Roman Army"], "correct_answer": "Roman Peace", "feedback": "Pax Romana was the long era of peace and prosperity that began under Augustus."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Augustus made the tax system fairer by turning tax collectors into permanent government workers.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "This reform reduced corruption in tax collecting."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Plebeians included artisans, shopkeepers, and owners of small farms.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Plebeians were most of Rome's people, though they had less social status than patricians."}, {"subject": "History", "section": "Chapter 8 - The Rise of Rome", "question": "Place these major Roman events in chronological order:", "type": "Ordering", "items": ["Rome becomes a republic", "Romans adopt the Twelve Tables", "Rome destroys Carthage", "Julius Caesar is assassinated", "Octavian becomes Rome's first emperor"], "correct_order": [0, 1, 2, 3, 4], "feedback": "These events trace Rome's rise from republic to empire.", "options": []}], "Chapter 9 - Roman Civilization": [{"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "The Romans borrowed many ideas from the Greeks but changed them to fit Roman needs.", "type": "True/False", "options": ["True", "False"], "correct_answer": "True", "feedback": "Romans admired Greek culture, but they adapted it for practical Roman use."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Roman statues often looked different from Greek statues because Roman statues were more:", "type": "Single Choice", "options": ["Realistic", "Mythical", "Colorful", "Gigantic"], "correct_answer": "Realistic", "feedback": "Roman artists showed wrinkles and other real features rather than ideal perfection."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Which Roman building feature helped support bridges, aqueducts, and buildings?", "type": "Single Choice", "options": ["Arch", "Pyramid", "Moat", "Terrace"], "correct_answer": "Arch", "feedback": "Romans were the first to make full use of the arch."}, {"subject": "History", "section": "Chapter 9 - Roman Civilization", "question": "Who wrote the Aeneid?", "type": "Single Choice", "opt let currentQuiz = [];
let currentIndex = 0;
let userAnswers = [];
let showFeedback = true;

// Wait for DOM to be ready
document.addEventListener('DOMContentLoaded', function() {
    // Debug: Check if data loaded
    console.log('ALL_QUESTIONS:', ALL_QUESTIONS);
    console.log('Subjects found:', Object.keys(ALL_QUESTIONS));

    // Initialize - populate subjects
    const subjects = Object.keys(ALL_QUESTIONS).sort();
    const subjectSelect = document.getElementById('subject-select');

    if (!subjectSelect) {
        console.error('subject-select element not found!');
        return;
    }

    if (subjects.length === 0) {
        console.error('No subjects found in data!');
        subjectSelect.innerHTML = '<option value="">No subjects found - check data</option>';
    } else {
        console.log('Populating', subjects.length, 'subjects');
        subjects.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            subjectSelect.appendChild(opt);
        });
    }

    // When subject changes, show sections
    subjectSelect.addEventListener('change', (e) => {
        const subject = e.target.value;
        const sectionsList = document.getElementById('sections-list');
        sectionsList.innerHTML = '';

        if (!subject) return;

        const sections = Object.keys(ALL_QUESTIONS[subject]).sort();
        sections.forEach(section => {
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = section;
            label.appendChild(cb);
            label.appendChild(document.createTextNode(' ' + section));
            sectionsList.appendChild(label);
        });
    });

    // Start quiz
    document.getElementById('start-quiz-btn').addEventListener('click', () => {
        const subject = subjectSelect.value;
    const selectedSections = Array.from(document.querySelectorAll('#sections-list input:checked')).map(cb => cb.value);
    showFeedback = document.getElementById('show-feedback').checked;

    if (!subject || selectedSections.length === 0) {
        alert('Please select a subject and at least one section');
        return;
    }

    // Build quiz with selected sections
    currentQuiz = [];
    selectedSections.forEach(section => {
        currentQuiz.push(...ALL_QUESTIONS[subject][section]);
    });

    // Shuffle questions every time
    for (let i = currentQuiz.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuiz[i], currentQuiz[j]] = [currentQuiz[j], currentQuiz[i]];
    }

    // Shuffle options for each question
    currentQuiz.forEach(q => {
        if (q.options && q.options.length > 0) {
            q.shuffledOptions = [...q.options];
            for (let i = q.shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [q.shuffledOptions[i], q.shuffledOptions[j]] = [q.shuffledOptions[j], q.shuffledOptions[i]];
            }
        }
    });

    userAnswers = new Array(currentQuiz.length).fill(null);
    currentIndex = 0;

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    document.getElementById('total').textContent = currentQuiz.length;
    showQuestion(0);
    });

    // Back button
    document.getElementById('back-btn').addEventListener('click', () => {
        if (confirm('Are you sure? Your progress will be lost.')) {
            location.reload();
        }
    });
}); // End DOMContentLoaded

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function showQuestion(index) {
    currentIndex = index;
    const q = currentQuiz[index];

    document.getElementById('current').textContent = index + 1;

    const container = document.getElementById('question-container');
    container.innerHTML = '';

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.textContent = (index + 1) + '. ' + q.question;
    container.appendChild(qText);

    // Handle EXTENDED question types
    if (q.type === 'Ordering') {
        const items = q.shuffledItems || shuffleArray([...q.items]);
        if (!q.shuffledItems) q.shuffledItems = items;
        if (!userAnswers[index]) userAnswers[index] = items.map((item, i) => ({item, position: i}));

        const orderedList = document.createElement('div');
        orderedList.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
        userAnswers[index].forEach((itemData, pos) => {
            const itemDiv = document.createElement('div');
            itemDiv.draggable = true;
            itemDiv.dataset.position = pos;
            itemDiv.style.cssText = 'padding:12px;background:white;border:2px solid #d2d2d7;border-radius:8px;cursor:move;';
            itemDiv.textContent = (pos+1) + '. ' + itemData.item;
            itemDiv.addEventListener('dragstart', (e) => {e.dataTransfer.setData('text/plain', pos); itemDiv.style.opacity='0.5';});
            itemDiv.addEventListener('dragend', () => itemDiv.style.opacity='1');
            itemDiv.addEventListener('dragover', (e) => e.preventDefault());
            itemDiv.addEventListener('drop', (e) => {
                e.preventDefault();
                const fromPos = parseInt(e.dataTransfer.getData('text/plain'));
                const toPos = parseInt(itemDiv.dataset.position);
                if (fromPos !== toPos) {
                    [userAnswers[index][fromPos], userAnswers[index][toPos]] = [userAnswers[index][toPos], userAnswers[index][fromPos]];
                    showQuestion(index);
                }
            });
            orderedList.appendChild(itemDiv);
        });
        container.appendChild(orderedList);
        const hint = document.createElement('div');
        hint.style.cssText = 'color:#86868b;font-size:14px;margin-top:8px;';
        hint.textContent = '💡 Drag items to reorder';
        container.appendChild(hint);
    } else if (q.type === 'Matching') {
        // Drag-and-drop matching: Terms on left, draggable match bubbles on right
        const shuffledMatches = q.shuffledMatches || shuffleArray([...q.pairs.map(p => p.match)]);
        if (!q.shuffledMatches) q.shuffledMatches = shuffledMatches;
        if (!userAnswers[index]) {
            userAnswers[index] = {};
            // Initialize with unmatched bubbles
            shuffledMatches.forEach(m => userAnswers[index][m] = null); // null means in bubble bank
        }

        const matchContainer = document.createElement('div');
        matchContainer.style.cssText = 'display:grid;gap:16px;';

        // Create term drop zones on the left
        q.pairs.forEach(pair => {
            const termBox = document.createElement('div');
            termBox.style.cssText = 'background:#f5f5f7;border-radius:12px;padding:16px;border:3px dashed #d2d2d7;min-height:70px;';
            termBox.dataset.term = pair.term;

            const termLabel = document.createElement('div');
            termLabel.style.cssText = 'font-weight:600;margin-bottom:8px;color:#1d1d1f;';
            termLabel.textContent = pair.term;
            termBox.appendChild(termLabel);

            // Show matched bubble if exists
            const matchedBubble = Object.entries(userAnswers[index]).find(([match, term]) => term === pair.term);
            if (matchedBubble) {
                const bubble = createMatchBubble(matchedBubble[0], index);
                termBox.appendChild(bubble);
            }

            // Drop zone handlers
            termBox.addEventListener('dragover', (e) => {e.preventDefault(); termBox.style.borderColor='#007aff';});
            termBox.addEventListener('dragleave', () => termBox.style.borderColor='#d2d2d7');
            termBox.addEventListener('drop', (e) => {
                e.preventDefault();
                termBox.style.borderColor='#d2d2d7';
                const matchText = e.dataTransfer.getData('text/plain');
                // Remove from previous location
                Object.keys(userAnswers[index]).forEach(key => {if (userAnswers[index][key] === pair.term) userAnswers[index][key] = null;});
                // Assign to this term
                userAnswers[index][matchText] = pair.term;
                showQuestion(index);
                updateNavButton();
            });

            matchContainer.appendChild(termBox);
        });
        container.appendChild(matchContainer);

        // Bubble bank for unmatched items
        const bubbleBank = document.createElement('div');
        bubbleBank.style.cssText = 'margin-top:20px;padding:16px;background:#e8f4f8;border-radius:12px;min-height:60px;';
        const bankLabel = document.createElement('div');
        bankLabel.style.cssText = 'font-weight:600;margin-bottom:12px;color:#1d1d1f;';
        bankLabel.textContent = '💭 Drag these matches to the terms above:';
        bubbleBank.appendChild(bankLabel);

        const bubblesContainer = document.createElement('div');
        bubblesContainer.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
        Object.entries(userAnswers[index]).forEach(([match, term]) => {
            if (term === null) { // Unmatched
                const bubble = createMatchBubble(match, index);
                bubblesContainer.appendChild(bubble);
            }
        });
        bubbleBank.appendChild(bubblesContainer);
        container.appendChild(bubbleBank);

        // Helper to create draggable bubble
        function createMatchBubble(matchText, qIndex) {
            const bubble = document.createElement('div');
            bubble.draggable = true;
            bubble.textContent = matchText;
            bubble.style.cssText = 'display:inline-block;padding:10px 16px;background:#007aff;color:white;border-radius:20px;cursor:move;font-size:14px;font-weight:500;user-select:none;';
            bubble.addEventListener('dragstart', (e) => {e.dataTransfer.setData('text/plain', matchText); bubble.style.opacity='0.5';});
            bubble.addEventListener('dragend', () => bubble.style.opacity='1');
            bubble.addEventListener('click', () => {
                // Click to return to bank
                userAnswers[qIndex][matchText] = null;
                showQuestion(qIndex);
                updateNavButton();
            });
            return bubble;
        }
    } else if (q.type === 'Fill-Blank') {
        if (!userAnswers[index]) userAnswers[index] = new Array(q.answers.length).fill('');
        const textParts = q.text_with_blanks.split('{{blank}}');
        const fillContainer = document.createElement('div');
        fillContainer.style.cssText = 'font-size:16px;line-height:2;';
        textParts.forEach((part, i) => {
            const textSpan = document.createElement('span');
            textSpan.textContent = part;
            fillContainer.appendChild(textSpan);
            if (i < textParts.length - 1) {
                const input = document.createElement('input');
                input.type = 'text';
                input.style.cssText = 'padding:6px 12px;border:2px solid #d2d2d7;border-radius:6px;min-width:120px;margin:0 4px;';
                input.value = userAnswers[index][i] || '';
                input.placeholder = 'Blank ' + (i+1);
                input.addEventListener('input', (e) => {userAnswers[index][i] = e.target.value; updateNavButton();});
                fillContainer.appendChild(input);
            }
        });
        container.appendChild(fillContainer);
    } else if (q.type === 'Categorization') {
        // Drag-and-drop categorization: Category drop zones + draggable item bubbles
        const shuffledItems = q.shuffledItems || shuffleArray([...q.items]);
        if (!q.shuffledItems) q.shuffledItems = shuffledItems;
        if (!userAnswers[index]) {
            userAnswers[index] = {};
            shuffledItems.forEach(item => userAnswers[index][item.text] = null); // null means uncategorized
        }

        const catContainer = document.createElement('div');
        catContainer.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;';

        // Create category drop zones
        q.categories.forEach(category => {
            const catZone = document.createElement('div');
            catZone.style.cssText = 'background:#f5f5f7;border-radius:12px;padding:16px;border:3px dashed #d2d2d7;min-height:100px;';
            catZone.dataset.category = category;

            const catLabel = document.createElement('div');
            catLabel.style.cssText = 'font-weight:600;margin-bottom:12px;color:#1d1d1f;text-align:center;';
            catLabel.textContent = category;
            catZone.appendChild(catLabel);

            const itemsInCat = document.createElement('div');
            itemsInCat.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
            // Show items assigned to this category
            Object.entries(userAnswers[index]).forEach(([itemText, cat]) => {
                if (cat === category) {
                    const bubble = createCatBubble(itemText, index);
                    itemsInCat.appendChild(bubble);
                }
            });
            catZone.appendChild(itemsInCat);

            // Drop zone handlers
            catZone.addEventListener('dragover', (e) => {e.preventDefault(); catZone.style.borderColor='#007aff';catZone.style.background='#e8f4f8';});
            catZone.addEventListener('dragleave', () => {catZone.style.borderColor='#d2d2d7';catZone.style.background='#f5f5f7';});
            catZone.addEventListener('drop', (e) => {
                e.preventDefault();
                catZone.style.borderColor='#d2d2d7';
                catZone.style.background='#f5f5f7';
                const itemText = e.dataTransfer.getData('text/plain');
                userAnswers[index][itemText] = category;
                showQuestion(index);
                updateNavButton();
            });

            catContainer.appendChild(catZone);
        });
        container.appendChild(catContainer);

        // Bubble bank for uncategorized items
        const bubbleBank = document.createElement('div');
        bubbleBank.style.cssText = 'padding:16px;background:#e8f4f8;border-radius:12px;min-height:60px;';
        const bankLabel = document.createElement('div');
        bankLabel.style.cssText = 'font-weight:600;margin-bottom:12px;color:#1d1d1f;';
        bankLabel.textContent = '💭 Drag these items to the categories above:';
        bubbleBank.appendChild(bankLabel);

        const bubblesContainer = document.createElement('div');
        bubblesContainer.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
        Object.entries(userAnswers[index]).forEach(([itemText, cat]) => {
            if (cat === null) { // Uncategorized
                const bubble = createCatBubble(itemText, index);
                bubblesContainer.appendChild(bubble);
            }
        });
        bubbleBank.appendChild(bubblesContainer);
        container.appendChild(bubbleBank);

        // Helper to create draggable bubble
        function createCatBubble(itemText, qIndex) {
            const bubble = document.createElement('div');
            bubble.draggable = true;
            bubble.textContent = itemText;
            bubble.style.cssText = 'display:inline-block;padding:10px 16px;background:#34c759;color:white;border-radius:20px;cursor:move;font-size:14px;font-weight:500;user-select:none;';
            bubble.addEventListener('dragstart', (e) => {e.dataTransfer.setData('text/plain', itemText); bubble.style.opacity='0.5';});
            bubble.addEventListener('dragend', () => bubble.style.opacity='1');
            bubble.addEventListener('click', () => {
                // Click to return to bank
                userAnswers[qIndex][itemText] = null;
                showQuestion(qIndex);
                updateNavButton();
            });
            return bubble;
        }
    } else if (q.type === 'Short Answer') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'answer-input';
        input.value = userAnswers[index] || '';
        input.addEventListener('input', (e) => {
            userAnswers[index] = e.target.value;
            updateNavButton();
        });
        container.appendChild(input);
    } else {
        const ul = document.createElement('ul');
        ul.className = 'options-list';
        const inputType = q.type === 'Multiple Choice' ? 'checkbox' : 'radio';
        const options = q.shuffledOptions || q.options;

        options.forEach(opt => {
            const li = document.createElement('li');
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = inputType;
            input.name = 'q' + index;
            input.value = opt;

            if (q.type === 'Multiple Choice') {
                const current = userAnswers[index] || [];
                input.checked = current.includes(opt);
                input.addEventListener('change', (e) => {
                    if (!userAnswers[index]) userAnswers[index] = [];
                    if (e.target.checked) {
                        if (!userAnswers[index].includes(opt)) userAnswers[index].push(opt);
                    } else {
                        userAnswers[index] = userAnswers[index].filter(a => a !== opt);
                    }
                    updateNavButton();
                });
            } else {
                input.checked = userAnswers[index] === opt;
                input.addEventListener('change', (e) => {
                    if (e.target.checked) userAnswers[index] = opt;
                    updateNavButton();
                });
            }

            label.appendChild(input);
            label.appendChild(document.createTextNode(opt));
            li.appendChild(label);
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    // Show existing feedback if revisiting
    if (showFeedback && userAnswers[index] !== null && container.querySelector('.feedback') === null) {
        const existing = document.getElementById('question-container').dataset.feedbackShown;
        if (existing === String(index)) {
            showQuestionFeedback(index);
        }
    }

    updateNavButton();
}

function showQuestionFeedback(index) {
    const q = currentQuiz[index];
    const userAns = userAnswers[index];
    const container = document.getElementById('question-container');

    if (container.querySelector('.feedback')) return;

    const isCorrect = gradeAnswer(q, userAns);
    const feedback = document.createElement('div');
    feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');

    if (isCorrect) {
        feedback.innerHTML = '<strong>✓ Correct!</strong>';
    } else {
        feedback.innerHTML = '<strong>✗ Incorrect.</strong> Correct: ' + formatAnswer(q.correct_answer);
    }

    if (q.feedback) {
        feedback.innerHTML += '<br><br>' + q.feedback;
    }

    container.appendChild(feedback);
    container.dataset.feedbackShown = index;
}

function updateNavButton() {
    const btn = document.getElementById('next-btn');
    const feedbackExists = document.getElementById('question-container').querySelector('.feedback');

    if (showFeedback && userAnswers[currentIndex] !== null && !feedbackExists) {
        btn.textContent = 'Check Answer';
        btn.onclick = () => {
            showQuestionFeedback(currentIndex);
            updateNavButton();
        };
    } else if (currentIndex < currentQuiz.length - 1) {
        btn.textContent = 'Next →';
        btn.onclick = () => showQuestion(currentIndex + 1);
    } else {
        btn.textContent = 'Finish Quiz';
        btn.onclick = finishQuiz;
    }
}

function gradeAnswer(q, userAns) {
    if (!userAns) return false;

    // Extended question types
    if (q.type === 'Ordering') {
        const userOrder = userAns.map(item => q.items.indexOf(item.item));
        return JSON.stringify(userOrder) === JSON.stringify(q.correct_order);
    }
    if (q.type === 'Matching') {
        return q.pairs.every(pair => userAns[pair.term] === pair.match);
    }
    if (q.type === 'Fill-Blank') {
        const caseSensitive = q.case_sensitive || false;
        return q.answers.every((ans, i) => {
            const userAnswer = userAns[i] || '';
            if (caseSensitive) {
                return userAnswer.trim() === ans.trim();
            } else {
                return userAnswer.trim().toLowerCase() === ans.trim().toLowerCase();
            }
        });
    }
    if (q.type === 'Categorization') {
        return q.items.every(item => userAns[item.text] === item.category);
    }

    // Traditional question types
    if (q.type === 'Multiple Choice') {
        const correct = new Set(Array.isArray(q.correct_answer) ? q.correct_answer : q.correct_answer.split(';').map(a => a.trim()));
        const user = new Set(Array.isArray(userAns) ? userAns : [userAns]);
        return correct.size === user.size && [...correct].every(a => user.has(a));
    }
    if (q.type === 'Short Answer') {
        // Split by semicolon to support multiple acceptable answers
        const acceptableAnswers = String(q.correct_answer).split(';').map(a => a.trim().toLowerCase());
        const userAnswer = String(userAns).trim().toLowerCase();
        return acceptableAnswers.includes(userAnswer);
    }
    return String(q.correct_answer) === String(userAns);
}

function formatAnswer(ans) {
    return Array.isArray(ans) ? ans.join('; ') : ans;
}

function finishQuiz() {
    let correct = 0;
    currentQuiz.forEach((q, i) => {
        if (gradeAnswer(q, userAnswers[i])) correct++;
    });

    const results = document.getElementById('results');
    const pct = Math.round((correct / currentQuiz.length) * 100);

    let html = '<div class="score-summary">Score: ' + correct + '/' + currentQuiz.length + ' (' + pct + '%)</div>';

    currentQuiz.forEach((q, i) => {
        const isCorrect = gradeAnswer(q, userAnswers[i]);
        html += '<div class="result-item ' + (isCorrect ? 'correct' : 'incorrect') + '">';
        html += '<div style="font-weight:bold">' + (i+1) + '. ' + q.question + '</div>';
        html += '<div>Your answer: ' + formatAnswer(userAnswers[i] || '(no answer)') + '</div>';
        if (!isCorrect) {
            html += '<div style="color:#28a745">Correct: ' + formatAnswer(q.correct_answer) + '</div>';
        }
        if (q.feedback) {
            html += '<div class="feedback">' + q.feedback + '</div>';
        }
        html += '</div>';
    });

    html += '<button class="btn-primary" onclick="location.reload()">New Quiz</button>';

    results.innerHTML = html;
    results.classList.remove('hidden');
    document.getElementById('question-container').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
}


// Service worker
if ('serviceWorker' in navigator) {
    const swCode = `
self.addEventListener('install', (event) => {
    event.waitUntil(caches.open('quiz-v1').then(cache => cache.addAll(['/'])));
});
self.addEventListener('fetch', (event) => {
    event.respondWith(caches.match(event.request).then(r => r || fetch(event.request)));
});
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
}
